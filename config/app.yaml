app:
  # 服务器配置
  server:
    host: "0.0.0.0"
    port: 8093

  # file-system-go 配置（v2.0：5 个文件 CRUD 端点）
  filesystem:
    base_url: "https://stock.duomi77.cn:1443"
    query_endpoint: "/api/files/query"
    timeout: 30
    cache_ttl: 30  # 视频列表缓存有效期（秒）

  # 文件配置
  files:
    output_dir: "data/output"
    status_file: "data/status.json"

  # ASR配置
  asr:
    provider: "aliyun"
    model: "fun-asr"
    access_key: "ALIYUN_ACCESS_KEY"

  # 日志配置
  logging:
    level: "INFO"
    console: true
    file: true
    dir: "logs"
