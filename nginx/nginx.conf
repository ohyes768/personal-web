# personal-web HTTPS 反向代理
# 适配 Next.js 15 basePath='' + 路径式反代
# proxy_pass 直接用 Docker 服务名（兼容 conf.d include 上下文）

server {
    listen 9443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 聚合页：根路径返回 HTML 列表（HTML 压成单行，避开 # 颜色码误解析）
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Personal Web</title><style>body{font-family:-apple-system,sans-serif;max-width:600px;margin:80px auto;padding:0 20px}h1{color:#1a1a1a}a{display:block;padding:16px 20px;margin:12px 0;background:#f5f5f7;border-radius:8px;color:#0066cc;text-decoration:none}a:hover{background:#e8e8ed}</style></head><body><h1>个人资讯网站</h1><a href="/dividend/">📈 股息率分析</a><a href="/douyin/">🎬 抖音视频文字稿</a></body></html>';
    }

    # dividend 静态资源
    location /dividend/_next/static {
        rewrite ^/dividend(_next/static/.*) $1 break;
        proxy_pass http://dividend-frontend:3003;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # douyin 静态资源
    location /douyin/_next/static {
        rewrite ^/douyin(_next/static/.*) $1 break;
        proxy_pass http://douyin-frontend:3004;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # 全局静态资源（basePath='' 时 HTML 直接引用 /_next/static/）
    location /_next/static {
        proxy_pass http://dividend-frontend:3003;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # dividend 页面
    location /dividend/ {
        proxy_pass http://dividend-frontend:3003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # douyin 页面
    # 注意：location 和 proxy_pass 都不带尾 / ——
    #   1. proxy_pass 不带尾 / ：basePath='/douyin' 时把 URI 原样转给上游。
    #   2. location 不带尾 / ：避免 nginx 自动给请求补尾 /，与 Next.js
    #      trailingSlash:false（默认）形成 redirect loop（/douyin ↔ /douyin/）。
    # 对比 dividend（basePath=''）：dividend 的 proxy_pass 仍带尾 / ，
    # 因为上游收到 / 时 root 没尾 / 概念，不会触发 trailingSlash 301。
    location /douyin {
        proxy_pass http://douyin-frontend:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # dividend API
    location /api/dividend/ {
        proxy_pass http://dividend-backend:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # douyin API
    # 注意：proxy_pass 带 /api/ —— 后端实际路由是 /api/videos, /api/aweme/..., /api/stats
    # 没有 /api/douyin/ 这一层。nginx 把 /api/douyin/ 前缀替换成 /api/。
    # 例：/api/douyin/videos → /api/videos
    location /api/douyin/ {
        proxy_pass http://douyin-backend:8093/api/;
        proxy_set_header Host $host;
    }

    # douyin v2.0 API
    location /api/aweme/ {
        proxy_pass http://douyin-backend:8093;
        proxy_set_header Host $host;
    }

    # file-system-go 文件代理（音频/字幕等大文件）
    # 注意：proxy_pass 不带尾 / —— file-system-go 的真实路径就是 /api/files/...
    # 客户端在 file-system-go 内网监听 8000
    location /api/files/ {
        proxy_pass http://file-system-go:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;       # 音频可能很大
        proxy_buffering off;           # 流式转发，避免缓冲占内存
        proxy_read_timeout 300s;      # 大文件下载超时
    }

    # rss-relay: freshrss 订阅入口（精确匹配，标准 RSS 2.0 XML）
    # 完整 URL：https://<nas-host>:9443/rss/personal.xml
    location = /rss/personal.xml {
        proxy_pass http://rss-relay-backend:8095/api/rss.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # rss-relay: agent 推送入口（剥前缀）
    # 后端实际路由是 /api/post，nginx 把 /api/rss-relay/ 替换成 /api/
    # 例：/api/rss-relay/post → /api/post
    location /api/rss-relay/ {
        proxy_pass http://rss-relay-backend:8095/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # rss-relay 前端：静态资源（rewrite 去掉 /rss 前缀，长前缀优先于下面的 /rss）
    location /rss/_next/static {
        rewrite ^/rss(_next/static/.*) $1 break;
        proxy_pass http://rss-relay-frontend:3006;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # rss-relay 前端 API（BFF 生产等价路径）
    # 因为 basePath='/rss'，浏览器请求 /rss/api/rss-relay/posts
    # nginx 剥两次前缀：去掉 /rss/api/rss-relay/ → 后端 /api/
    # 长前缀优先于下面的 location /rss
    location /rss/api/rss-relay/ {
        proxy_pass http://rss-relay-backend:8095/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # rss-relay 前端：页面（不带尾 /，参考 douyin 模式避免 redirect loop）
    # 注意：location 不带尾 / ——
    #   1. proxy_pass 不带 URI：basePath='/rss' 时把 URI 原样转给上游
    #   2. location 不带尾 /：避免 nginx 自动给请求补尾 /，与 Next.js
    #      trailingSlash:false（默认）形成 redirect loop
    # 与 location = /rss/personal.xml（精确匹配，优先级最高）不冲突
    location /rss {
        proxy_pass http://rss-relay-frontend:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
