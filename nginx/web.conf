# personal-web HTTPS 反向代理
# 适配 Next.js 15 basePath='' + 路径式反代

# DNS 解析器（Docker 内置 127.0.0.11）
# valid=5s：nginx worker 每 5 秒重新解析一次上游域名，
# 即使容器 IP 变了，最多 5 秒后所有 worker 都看到新 IP。
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

# upstream 块（关键：用 server <name> resolve;）
# resolve 参数让 nginx 在 valid TTL 内重新解析此 server 域名，
# 从根本上解决 Docker compose 重启容器 → IP 漂移 → 502 的问题。
# 比变量形式 proxy_pass 更稳，因为：
#   1. 显式声明哪些域名需要重新解析（无需配合 set 变量）
#   2. 每个 upstream 独立健康检查 + keepalive 池
#   3. 支持 backup/down/max_fails 等高级负载均衡策略
# 参考：https://nginx.org/en/docs/http/ngx_http_upstream_module.html#resolve
# zone 参数：upstream 必须有共享内存区才能用 resolve 参数做运行时 DNS 解析。
# 64k 是默认值，足够几个容器名解析使用。
upstream dividend_backend  { zone dividend_backend  64k; server dividend-backend:8092  resolve; keepalive 16; }
upstream dividend_frontend { zone dividend_frontend 64k; server dividend-frontend:3003 resolve; keepalive 16; }
upstream douyin_backend    { zone douyin_backend    64k; server douyin-backend:8093    resolve; keepalive 16; }
upstream douyin_frontend   { zone douyin_frontend   64k; server douyin-frontend:3004   resolve; keepalive 16; }
upstream rss_relay_backend  { zone rss_relay_backend  64k; server rss-relay-backend:8095  resolve; keepalive 16; }
upstream rss_relay_frontend { zone rss_relay_frontend 64k; server rss-relay-frontend:3006 resolve; keepalive 16; }
upstream macro_backend  { zone macro_backend  64k; server macro-backend:8094  resolve; keepalive 16; }
upstream macro_frontend { zone macro_frontend 64k; server macro-frontend:3001 resolve; keepalive 16; }

server {
    listen 9443 ssl;
    server_name localhost web.duomi77.cn;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 聚合页：根路径返回 HTML 列表（HTML 压成单行，避开 # 颜色码误解析）
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Personal Web</title><style>body{font-family:-apple-system,sans-serif;max-width:600px;margin:80px auto;padding:0 20px}h1{color:#1a1a1a}a{display:block;padding:16px 20px;margin:12px 0;background:#f5f5f7;border-radius:8px;color:#0066cc;text-decoration:none}a:hover{background:#e8e8ed}</style></head><body><h1>个人资讯网站</h1><a href="/dividend/">📈 股息率分析</a><a href="/douyin/">🎬 抖音视频文字稿</a><a href="/rss/">📡 RSS 中转</a><a href="/macro/">📊 宏观经济</a></body></html>';
    }

    # dividend 静态资源
    # proxy_pass 必须带 trailing slash（"/_next/static/"），nginx 才会做 URI 替换：
    #   请求 /dividend/_next/static/chunks/xxx.js
    #     → location /dividend/_next/static 匹配
    #     → proxy_pass URI "/_next/static/" 替换 location 前缀
    #     → 上游收到 /_next/static/chunks/xxx.js ✅
    # 若 proxy_pass 不带 URI（纯 upstream 名），nginx 会忽略 rewrite、原样转发，
    # 上游会拿到 /dividend/_next/static/... → 404。
    location /dividend/_next/static/ {
        proxy_pass http://dividend_frontend/_next/static/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # douyin 静态资源
    # douyin-frontend 用 basePath=/douyin，Next.js 只在 /douyin/_next/static/... 暴露静态资源。
    location /douyin/_next/static/ {
        proxy_pass http://douyin_frontend/douyin/_next/static/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # rss-relay 静态资源
    # rss-relay-frontend 用 basePath=/rss，Next.js 只在 /rss/_next/static/... 暴露静态资源。
    # proxy_pass URI 必须含完整 basePath 才能替换 location 匹配的前缀。
    location /rss/_next/static/ {
        proxy_pass http://rss_relay_frontend/rss/_next/static/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # 全局静态资源（basePath='' 时 HTML 直接引用 /_next/static/）
    location /_next/static {
        proxy_pass http://dividend_frontend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # dividend 页面
    location /dividend/ {
        proxy_pass http://dividend_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # douyin 页面
    # 注意：location 和 proxy_pass 都不带尾 / ——
    #   1. proxy_pass 不带尾 / ：basePath='/douyin' 时把 URI 原样转给上游。
    #   2. location 不带尾 / ：避免 nginx 自动给请求补尾 /，与 Next.js
    #      trailingSlash:false（默认）形成 redirect loop（/douyin ↔ /douyin/）。
    location /douyin {
        proxy_pass http://douyin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # dividend API
    location /api/dividend/ {
        proxy_pass http://dividend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # douyin API
    # upstream 名形式 proxy_pass 不做 URI 替换（同变量形式），
    # 手动 rewrite 剥前缀。
    location /api/douyin/ {
        rewrite ^/api/douyin/(.*)$ /api/$1 break;
        proxy_pass http://douyin_backend;
        proxy_set_header Host $host;
    }

    # douyin v2.0 API
    location /api/aweme/ {
        proxy_pass http://douyin_backend;
        proxy_set_header Host $host;
    }

    # rss-relay BFF：/rss/api/rss-relay/<slug> → 后端 /api/<slug>
    # 绕过前端 BFF（容器内 localhost:8095），更稳
    location /rss/api/rss-relay/ {
        rewrite ^/rss/api/rss-relay/(.*)$ /api/$1 break;
        proxy_pass http://rss_relay_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # rss-relay 页面（basePath='/rss'，参照 douyin 的写法）
    # /rss/ → /rss 一次性重定向，避免 Next.js trailingSlash 默认跳转
    location = /rss/ { return 301 /rss; }
    location /rss {
        proxy_pass http://rss_relay_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # macro 静态资源（basePath='/macro'，参照 /douyin/_next/static/）
    location /macro/_next/static/ {
        proxy_pass http://macro_frontend/macro/_next/static/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    # macro 页面（basePath='/macro'，参照 location /douyin 不带尾斜杠，避免 trailingSlash redirect loop）
    location /macro {
        proxy_pass http://macro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # macro API：走前端 BFF catch-all（不剥前缀）。BFF 再把 /api/macro/<x> → macro-backend:8094/api/<x>
    location /api/macro/ {
        proxy_pass http://macro_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}