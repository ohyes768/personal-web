# Optional OpenClaw grouped-skill discovery adapter. Apply alongside the main
# compose file after setting OPENCLAW_CONFIG_HOST_PATH to the existing JSON file:
# docker compose -f docker-compose.nas.yml -f deploy/docker-compose.skill-packs.yml up -d ...
services:
  skill-manager-backend:
    volumes:
      - type: bind
        source: ${OPENCLAW_CONFIG_HOST_PATH:?set actual existing openclaw.json path}
        target: /agent-config/openclaw.json
        bind:
          create_host_path: false
    environment:
      OPENCLAW_CONFIG_PATH: /agent-config/openclaw.json
