# Copy as a compose override; set BOTH target JSON and actual same-path mounts.
# docker compose -f docker-compose.nas.yml -f <your-override>.yml up -d --build skill-manager-backend skill-manager-frontend
services:
  skill-manager-backend:
    volumes:
      - type: bind
        source: ${HERMES_OHYES768_SKILLS_HOST_PATH:?set actual profile skills directory}
        target: ${HERMES_OHYES768_SKILLS_HOST_PATH:?}
        bind:
          create_host_path: false
    # Additional profiles require another explicit skills-only bind mount here.
