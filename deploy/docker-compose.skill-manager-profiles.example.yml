# These mounts are now included in docker-compose.nas.yml by default.
# Optional reference for deployments with a separate compose file.
# No per-profile skills mount is needed under the mounted profiles root.
services:
  skill-manager-backend:
    volumes:
      - type: bind
        source: ${HERMES_SKILLS_HOST_PATH:-/home/ohyes768/.hermes/skills}
        target: ${HERMES_SKILLS_HOST_PATH:-/home/ohyes768/.hermes/skills}
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_HOST_PATH:-/home/ohyes768/.hermes/profiles}
        target: ${HERMES_PROFILES_HOST_PATH:-/home/ohyes768/.hermes/profiles}
        bind:
          create_host_path: false
