<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>housing-map · 采集任务弹框 改造稿</title>
<style>
  :root {
    --bg-primary: #F5F6F8;
    --bg-surface: #FFFFFF;
    --bg-elevated: #F0F2F5;
    --border: #E3E6EB;
    --text-primary: #1F2429;
    --text-muted: #7A828C;
    --accent-warm: #B45F3F;
    --danger: #a74325;
    --ok: #2E8B44;
    --font-sans: 'Geist Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 72px;
    background: var(--bg-primary); color: var(--text-primary);
    font-family: var(--font-sans); font-size: 13px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .page-head { max-width: 900px; margin: 0 auto 28px; }
  .page-head h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.01em; }
  .page-head p { margin: 0; color: var(--text-muted); font-size: 12.5px; }
  .scenario {
    display: inline-flex; gap: 2px; margin-top: 14px; padding: 3px;
    background: var(--bg-elevated); border-radius: 9px;
  }
  .scenario button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    padding: 6px 14px; border-radius: 6px; font: inherit; font-size: 12.5px;
    color: var(--text-muted);
  }
  .scenario button[aria-pressed="true"] {
    background: var(--bg-surface); color: var(--text-primary);
    box-shadow: 0 1px 2px rgba(15,23,42,.08); font-weight: 500;
  }

  .wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 32px; }
  .caption { margin: 0 0 10px; font-size: 12px; color: var(--text-muted); }
  .caption b { color: var(--text-primary); font-weight: 600; }

  .dialog {
    background: var(--bg-surface); border-radius: 12px;
    box-shadow: 0 15px 70px #0003; overflow: hidden;
  }
  .dialog-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .dialog-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; font-family: inherit; white-space: nowrap;
  }
  .btn-primary { background: var(--accent-warm); color: #fff; }
  .btn-secondary { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .dialog-body { padding: 4px 20px 18px; }

  /* ---- 任务行 ---- */
  .task {
    display: grid;
    grid-template-columns: 10px auto auto auto 1fr auto;
    align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .task:last-child { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .dot[data-state="running"] { background: var(--accent-warm); animation: pulse 1.6s ease-in-out infinite; }
  .dot[data-state="failed"] { background: var(--danger); }
  .name { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  /* 「?」说明入口：点击展开、悬浮出摘要 */
  .help {
    appearance: none; cursor: pointer; font: inherit;
    width: 16px; height: 16px; padding: 0; border-radius: 50%;
    border: 1px solid #C7CDD4; background: transparent;
    color: var(--text-muted); font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .help:hover { border-color: var(--accent-warm); color: var(--accent-warm); background: #FBEDE8; }
  .help[aria-expanded="true"] { border-color: var(--accent-warm); color: var(--accent-warm); background: #FBEDE8; }
  .pill {
    display: inline-flex; align-items: center; padding: 2px 9px;
    border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
    background: var(--bg-elevated); color: var(--text-muted);
  }
  .pill[data-tone="running"] { background: #FBEDE8; color: var(--accent-warm); }
  .pill[data-tone="warn"]    { background: #FBF3E4; color: #A97B1F; }
  .pill[data-tone="failed"]  { background: #FBEAE6; color: var(--danger); }
  .pill[data-tone="ok"]      { background: #EDF4EC; color: var(--ok); }
  .metrics {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    color: var(--text-muted); font-size: 12px; min-width: 0;
  }
  .metrics span { white-space: nowrap; }
  .metrics b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
  .metrics .sep { color: #C7CDD4; }
  .actions { display: flex; gap: 8px; }
  .info {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    color: var(--text-muted); font: inherit; font-size: 12px;
    padding: 3px 7px; border-radius: 6px; white-space: nowrap;
  }
  .info:hover { color: var(--text-primary); background: var(--bg-elevated); }

  /* ---- 展开区：行内「说明」开关，展开后内容占满整行 ---- */
  .detail-body {
    grid-column: 1 / -1; margin-top: 8px; padding: 10px 12px;
    border-left: 2px solid var(--border);
    color: #596c86; font-size: 12px; line-height: 1.75; max-width: 660px;
  }
  .detail-body[hidden] { display: none; }
  .info[aria-expanded="true"] { color: var(--accent-warm); background: #FBEDE8; }
  .detail-body .k { color: var(--text-primary); font-weight: 600; }
  /* 明细：行内「名 值」对，只显示非零 */
  .pairs { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  .pairs span { display: inline-flex; align-items: baseline; gap: 5px; font-size: 12px; }
  .pairs i { font-style: normal; color: var(--text-muted); }
  .pairs b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---- 分组 ---- */
  .group { margin: 10px 0 2px; padding: 10px 12px; border: 1px solid #dce3ec; border-radius: 8px; background: var(--bg-surface); }
  .group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .group-head strong { font-size: 12.5px; color: #a65f40; }
  .group-head span { font-size: 12px; color: var(--text-muted); }
  .group .task { padding: 10px 0; border-bottom: 0; }
  .group .task + .task { border-top: 1px solid #eef2f7; }

  .note { margin: 14px 0 0; font-size: 12px; color: var(--text-muted); }
  @keyframes pulse { 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>

              <span class="k">范围</span>仅已收录住宅中已关联幸福里的小区；采集房源并更新租金统计，不会查找或关联来源。<br />
              <span class="k">继续采集</span>只补尚未采集、失败或未完成的小区；已查完但无房源的不重复采集，保留现有成功数据。
        </div>

        
</div>
        </div>
      </div>
      <div class="task" data-id="auction">
        <span class="dot" data-state="idle"></span>
        <span class="name">采集法拍</span>
        <button class="help" type="button" aria-expanded="false" aria-label="查看采集法拍说明" title="采集滨江法拍，匹配住宅，未匹配的进入待关联。">?</button>
        <span class="pill" data-tone="idle">尚未采集</span>
        <span class="metrics"></span>
        <span class="actions"><button class="btn btn-primary">开始</button></span>
        <div class="detail-body" hidden>采集滨江法拍，匹配住宅，未匹配的进入待关联。</div>
      </div>`,
  },
};

const BUSY = {
  admission: {
    tmsf: { dot: 'idle', pill: '已完成 · 120/120', tone: 'ok',
      metrics: '新来源 <b>34</b> · 已有 <b>86</b>',
      detail: [['基本资料齐备','86'],['待地点匹配','21'],['身份待核对','5'],['网络可重试','8'],['基本资料待取得','0']] },
    amap: { dot: 'running', pill: '运行中 · 40/61', tone: 'running',
      metrics: '待人工确认 <b>6</b> · 未找到 <b>2</b>',
      detail: [['已匹配','33'],['待人工确认','6'],['未找到主体地点','2'],['查询失败','1']] },
    use: { dot: 'idle', pill: '尚未采集', tone: 'idle', metrics: '', detail: [] },
  },
  maintenance: {
    rentalMatch: { dot: 'idle', pill: '匹配完成 · 45/45', tone: 'ok',
      metrics: '已关联 <b>38</b> · 待选择 <b>4</b> · 未找到 <b>3</b>',
      detail: [['已检查','45'],['已关联','38'],['待选择','4'],['未找到','3'],['查询失败','0'],['未查完','0'],['未查询','0']] },
    rent: { dot: 'running', pill: '运行中 · 12/48', tone: 'running',
      metrics: '复用 <b>6</b> · 待采 <b>3</b>',
      detail: [['成功','9'],['失败','0'],['暂无房源','2'],['待选择','1']] },
    auction: { dot: 'idle', pill: '尚未采集', tone: 'idle', metrics: '', detail: [] },
  },
};

function render(el, data, body) {
  el.innerHTML = `<div class="dialog-head"><h3>${data.title}</h3>
    <button class="btn btn-secondary">关闭</button></div><div class="dialog-body">${body}</div>`;
}

function applyBusy(root, scope, scene) {
  const map = scene === 'busy' ? BUSY[scope] : null;
  root.querySelectorAll('.task').forEach(task => {
    const id = task.dataset.id;
    const cfg = map && map[id];
    const dot = task.querySelector('.dot');
    const pill = task.querySelector('.pill');
    const met = task.querySelector('.metrics');
    const det = task.querySelector('.detail-body');
    if (!cfg) {
      dot.dataset.state = 'idle'; pill.dataset.tone = 'idle';
      return;
    }
    dot.dataset.state = cfg.dot;
    pill.dataset.tone = cfg.tone;
    pill.textContent = cfg.pill;
    if (met) met.innerHTML = cfg.metrics || '';
    // 明细数字追加在说明正文之后，不覆盖说明
    if (det && cfg.detail) {
      const pairs = cfg.detail.filter(([, v]) => Number(v) !== 0)
        .map(([k, v]) => `<span><i>${k}</i><b>${v}</b></span>`).join('');
      det.dataset.explain = det.dataset.explain || det.innerHTML;
      det.innerHTML = det.dataset.explain + (pairs ? `<div class="pairs">${pairs}</div>` : '');
    }
  });
}

function renderAll(scene) {
  render(document.getElementById('admission-old'), OLD.admission, OLD.admission.body);
  render(document.getElementById('maintenance-old'), OLD.maintenance, OLD.maintenance.body);
  const an = document.getElementById('admission-new');
  const mn = document.getElementById('maintenance-new');
  render(an, NEW.admission, NEW.admission.body);
  render(mn, NEW.maintenance, NEW.maintenance.body);
  applyBusy(an, 'admission', scene);
  applyBusy(mn, 'maintenance', scene);
}

document.addEventListener('click', event => {
  const btn = event.target.closest('.help');
  if (!btn) return;
  const panel = btn.closest('.task').querySelector('.detail-body');
  if (!panel) return;
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  panel.hidden = open;
});

document.querySelectorAll('.scenario button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scenario button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    renderAll(btn.dataset.scene);
  });
});

renderAll('idle');
</script>
</body>
</html>
