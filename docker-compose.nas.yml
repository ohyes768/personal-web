# =============================================================================
# 个人财富网站 - NAS 部署统一编排
# =============================================================================
# 用途：Ubuntu Server NAS 部署（10 个后端 + 10 个前端，共 20 个服务）
# 用法：
#   1. 准备 .env：在仓库根目录创建 .env，填入各服务 key（已被 .gitignore 忽略）
#        cat > .env << 'EOF'
#        DIVIDEND_ALIYUN_ACCESS_KEY=你的key
#        DOUYIN_ALIYUN_ACCESS_KEY=你的key
#        RSS_RELAY_TOKEN=随机字符串
#        FRED_API_KEY=FRED数据key
#        ALIYUN_API_APPCODE=阿里云行情API appcode（dividend/macro 共用，留空则行情/商品接口报错）
#        GAODE_MAP_KEY=高德地图key（housing-map 前端 build arg）
#        GAODE_MAP_SECURITY_KEY=高德地图安全密钥（housing-map 前端 build arg）
#        SKILLS_SOURCE_HOST_PATH=NAS 上 skills 仓库路径
#        GITHUB_SKILL_CACHE_HOST_PATH=GitHub 缓存目录路径
#        HERMES_SKILLS_HOST_PATH=/home/ohyes768/.hermes/skills（可选覆盖默认路径）
#        HERMES_PROFILES_HOST_PATH=/home/ohyes768/.hermes/profiles（可选覆盖默认路径）
#        SKILL_MANAGER_ADMIN_PASSWORD=skill-manager 管理密码
#        EOF
#   2. 启动：  docker compose -f docker-compose.nas.yml up -d --build
#              （自动读取根目录 .env）
#   3. 验证：  docker compose -f docker-compose.nas.yml ps
#   4. 停止：  docker compose -f docker-compose.nas.yml down
#
# 网络路由（路径式反代，由 NAS 上外部 Nginx 统一对外）：
#   /dividend/*     → dividend-frontend:3003
#   /api/dividend/* → dividend-backend:8092
#   /douyin/*       → douyin-frontend:3004
#   /api/douyin/*   → douyin-backend:8093
#   /rss/*                    → rss-relay-frontend:3006  (列表页)
#   /rss/api/rss-relay/*      → rss-relay-backend:8099/api/*  (freshrss 订阅 + agent 推送)
#   前端 BFF /rss/api/rss-relay/<slug> 已废弃，nginx 直转后端
#   /macro/*     → macro-frontend:3001   (basePath = /macro)
#   /api/macro/*    → macro-backend:8094/api/*  (nginx 直转后端；macro 前端 BFF 已删除)
#   /funds/*         → fund-select-frontend:3005  (basePath = /funds，apps/fund-select/)
#   /api/funds/*   → fund-select-backend:8095/api/*  (nginx 直转后端；fund-select 前端 BFF 仅本地)
#   /map/*         → housing-map-frontend:3007  (basePath = /map，apps/housing-map/)
#   /api/map/*     → housing-map-backend:8096/api/*  (nginx 直转后端)
#   /skills/*      → skill-manager-frontend:3008  (basePath = /skills，apps/skill-manager/)
#   /api/skills/*  → skill-manager-backend:8097/api/skills/*  (nginx 原样直转后端)
#   /api/export-targets/* → skill-manager-backend:8097/api/export-targets/*
#   /index-trends/*      → index-trends-frontend:3010  (basePath = /index-trends，apps/index-trends/)
#   /api/index-trends/*  → index-trends-backend:8100/api/*  (nginx 直转后端)
#   /tasks/*             → task-web-frontend:3011  (basePath = /tasks，apps/task-web/)
#   /api/task-web/*      → task-web-backend:8101/api/*  (nginx 直转后端)
#   /services/*          → service-manager-frontend:3012  (basePath = /services，apps/service-manager/)
#   /api/services/*      → service-manager-backend:8102/api/*  (nginx 直转后端，剥前缀)
#                          容器元数据经 socket-proxy（只读 GET）读取 Docker Engine
#
# 数据卷（用 named volume，docker 自动管理在 /var/lib/docker/volumes/）：
#   dividend-data / dividend-logs / dividend-config
#   douyin-data / douyin-logs
#   rss-relay-data
#   macro-data / macro-logs
#   fund-select-data / fund-select-cache / fund-select-logs
#   housing-map-data / housing-map-logs
#   index-trends-data
#   task-web-data（SQLite + 运行日志；业务仓库 bind mount 见 task-web-backend 服务）
#   service-manager-data（SQLite 台账 + 恢复前备份）
# skill-manager 服务已合并到主文件，各服务共享 .env 变量，详见 docs/skill-manager-nas-setup.md
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # dividend 后端（A股高股息分析）
  # ---------------------------------------------------------------------------
  dividend-backend:
    build:
      context: ./backend/dividend-select
    container_name: dividend-backend
    restart: unless-stopped
    expose:
      - "8092"
    volumes:
      - dividend-data:/app/data
      - dividend-logs:/app/logs
      - dividend-config:/app/config
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - DIVIDEND_PORT=8092
      - ALIYUN_ACCESS_KEY=${DIVIDEND_ALIYUN_ACCESS_KEY:-}
      - ALIYUN_API_APPCODE=${ALIYUN_API_APPCODE:-}
      - PYWENCAI_COOKIE=${PYWENCAI_COOKIE:-}
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
      # 基本面评级（Hermes Runs API）；留空则 /quality/analyze 返回 503，其余功能不受影响
      - HERMES_BASE_URL=${HERMES_BASE_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_PROFILE=${HERMES_PROFILE:-ohyes768}
      - HERMES_POLL_INTERVAL=${HERMES_POLL_INTERVAL:-30}
      - HERMES_TIMEOUT=${HERMES_TIMEOUT:-3600}
      - HERMES_MAX_CONCURRENT=${HERMES_MAX_CONCURRENT:-1}
      - HERMES_QUALITY_SKILL_VERSION=${HERMES_QUALITY_SKILL_VERSION:-}
      - HERMES_QUALITY_SKILL_PATH=${HERMES_QUALITY_SKILL_PATH:-}
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${DIVIDEND_PORT:-8092}/api/dividend/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # dividend 前端（Next.js，basePath 已改为空）
  # ---------------------------------------------------------------------------
  dividend-frontend:
    # 固定镜像名，与 deploy-nas.sh buildx --tag 一致（否则 compose 用项目前缀名，buildx 白打）
    image: dividend-frontend:latest
    build:
      context: ./apps/dividend
      dockerfile: Dockerfile
    container_name: dividend-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
      # BACKEND_URL 不带 /api/dividend 前缀，由 BFF catch-all 路由从 request.url 提取完整路径
      - BACKEND_URL=http://dividend-backend:8092
    networks:
      - app-net
    depends_on:
      dividend-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # douyin 后端（抖音视频文字转写）
  # ---------------------------------------------------------------------------
  douyin-backend:
    build:
      context: ./backend/douyin-processor
    container_name: douyin-backend
    restart: unless-stopped
    expose:
      - "8093"
    volumes:
      - douyin-data:/app/data
      - douyin-logs:/app/logs
      - ./backend/douyin-processor/config:/app/config:ro  # file-system-go 地址可热改，无需 rebuild
    environment:
      - ALIYUN_ACCESS_KEY=${DOUYIN_ALIYUN_ACCESS_KEY:-}
      - DOUYIN_RSS_TOKEN=${DOUYIN_RSS_TOKEN:-}
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # douyin 前端（Next.js，basePath 已改为空）
  # ---------------------------------------------------------------------------
  douyin-frontend:
    image: douyin-frontend:latest
    build:
      context: ./apps/douyin
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 是 build-time inline，必须在 build 阶段传
        NEXT_PUBLIC_DOUYIN_RSS_TOKEN: ${DOUYIN_RSS_TOKEN:-}
    container_name: douyin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
      - DOUYIN_BACKEND_URL=http://douyin-backend:8093/api
      - AWEME_BACKEND_URL=http://douyin-backend:8093/api/aweme
      - NEXT_PUBLIC_DOUYIN_RSS_TOKEN=${DOUYIN_RSS_TOKEN:-}
    networks:
      - app-net
    depends_on:
      douyin-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # rss-relay 后端（个人 RSS 中转：agent 推送 markdown，对外 RSS 2.0 feed）
  # ---------------------------------------------------------------------------
  rss-relay-backend:
    build:
      context: ./backend/rss-relay
    container_name: rss-relay-backend
    restart: unless-stopped
    expose:
      - "8099"
    volumes:
      - rss-relay-data:/app/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RSS_RELAY_TOKEN=${RSS_RELAY_TOKEN:-}
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # rss-relay 前端（Next.js，列表页浏览推送的 markdown）
  # ---------------------------------------------------------------------------
  rss-relay-frontend:
    image: rss-relay-frontend:latest
    build:
      context: ./apps/rss-relay
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 是 build-time inline，必须在 build 阶段传
        NEXT_PUBLIC_RSS_TOKEN: ${RSS_RELAY_TOKEN:-}
    container_name: rss-relay-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
      # BFF 用：把 /api/rss-relay/<path> 转到 http://rss-relay-backend:8099/api/<path>
      - BACKEND_URL=http://rss-relay-backend:8099/api
    networks:
      - app-net
    depends_on:
      rss-relay-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # macro 后端（全球宏观经济：美/欧/日国债、汇率、VIX、商品、股指、资金流向）
  # backend/macro（FastAPI + FRED + 阿里云商品 API）
  # ---------------------------------------------------------------------------
  macro-backend:
    build:
      context: ./backend/macro
    container_name: macro-backend
    restart: unless-stopped
    expose:
      - "8094"
    volumes:
      - macro-data:/app/data
      - macro-logs:/app/logs
    # 定时任务日志: /app/logs/scheduler.log + docker logs macro-backend
    # 执行历史: /app/data/scheduler/history.jsonl
    # 排查 API: GET /api/scheduler/status
    environment:
      - TZ=Asia/Shanghai
      - FRED_API_KEY=${FRED_API_KEY}
      - ALIYUN_API_APPCODE=${ALIYUN_API_APPCODE:-}
      - MACRO_SIGNAL_DATA_DIR=/app/data/macro-signals
      - MACRO_SIGNAL_UPLOAD_TOKEN=${MACRO_SIGNAL_UPLOAD_TOKEN:-}
      # 报告看板: impact skill 推送 markdown 分析报告(POST /api/reports/upload, X-Upload-Token)
      # 鉴权复用 MACRO_SIGNAL_UPLOAD_TOKEN;MACRO_REPORT_DATA_DIR 挂 macro-data volume
      - MACRO_REPORT_DATA_DIR=/app/data/reports
      - ANALYSIS_PASSWORD=${ANALYSIS_PASSWORD:-}
      - ANALYSIS_SIGNING_SECRET=${ANALYSIS_SIGNING_SECRET:-}
      - ANALYSIS_COOKIE_SECURE=true
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
    networks:
      - app-net
    healthcheck:
      # router prefix = /api，health 端点在 routes.py @router.get("/health")
      test: ["CMD", "curl", "-f", "http://localhost:8094/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # macro 前端（Next.js，basePath = /macro）
  # API 请求不经前端：nginx 把 /api/macro/* 直转 macro-backend（见 nginx/web.conf），
  # 前端代码无 BFF 路由，也不读 BACKEND_URL
  # ---------------------------------------------------------------------------
  macro-frontend:
    image: macro-frontend:latest
    build:
      context: ./apps/macro
      dockerfile: Dockerfile
    container_name: macro-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
    networks:
      - app-net
    depends_on:
      macro-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # fund-select 后端（债基筛选，backend/fund-select/）
  # ---------------------------------------------------------------------------
  fund-select-backend:
    build:
      context: ./backend/fund-select
    container_name: fund-select-backend
    restart: unless-stopped
    expose:
      - "8095"
    volumes:
      - fund-select-data:/app/data
      - fund-select-cache:/app/cache
      - fund-select-logs:/app/logs
      # /app/config 不挂 volume：静态配置随镜像 COPY 分发，挂 volume 会被旧内容遮蔽
      # （benchmarks.yaml 因此在 NAS 上 FileNotFoundError，2026-09-03 修复）
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=8095
      - LOG_LEVEL=INFO
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${SERVER_PORT:-8095}/api/funds/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # fund-select 前端（Next.js 15，basePath='/funds'，apps/fund-select/）
  # BFF 用 BACKEND_URL 找到后端 service name
  # ---------------------------------------------------------------------------
  fund-select-frontend:
    image: fund-select-frontend:latest
    build:
      context: ./apps/fund-select
      dockerfile: Dockerfile
    container_name: fund-select-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/funds
      - BACKEND_URL=http://fund-select-backend:8095
    networks:
      - app-net
    depends_on:
      fund-select-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # housing-map 后端（滨江区购房地图，backend/housing-map/）
  # 静态数据随镜像 COPY 到 /app/data，首次挂空 named volume 自动 seed；
  # refresh 重写 price_snapshots.jsonl 写入 volume 持久化
  # ---------------------------------------------------------------------------
  housing-map-backend:
    build:
      context: ./backend/housing-map
    container_name: housing-map-backend
    restart: unless-stopped
    expose:
      - "8096"
    volumes:
      - housing-map-data:/app/data
      - housing-map-logs:/app/logs
    environment:
      - AMAP_WEB_SERVICE_KEY=${AMAP_WEB_SERVICE_KEY:-${GAODE_API_KEY:-}}
      - TZ=Asia/Shanghai
      - HOUSING_PORT=8096
      - LOG_LEVEL=INFO
      - HOUSING_TMSF_BROWSER_URL=http://housing-map-browser:8097
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${HOUSING_PORT:-8096}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Independent, lazy TMSF browser. Internal only; no business volume or public port.
  # No depends_on: a browser outage must not prevent ESF/API service startup.
  housing-map-browser:
    build:
      context: ./backend/housing-map
      dockerfile: Dockerfile.browser
    container_name: housing-map-browser
    restart: unless-stopped
    init: true
    shm_size: '256mb'
    mem_limit: 1g
    cpus: 1.0
    expose:
      - "8097"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - app-net

  # housing-map 前端（Next.js 16，basePath='/map'，apps/housing-map/）
  # API 请求不经前端：nginx 把 /api/map/* 直转 housing-map-backend（见 nginx/web.conf）
  # 高德 key 是 build-time inline，必须在 build 阶段经 args 传入（根 .env 提供）
  # ---------------------------------------------------------------------------
  housing-map-frontend:
    image: housing-map-frontend:latest
    build:
      context: ./apps/housing-map
      dockerfile: Dockerfile
      args:
        # 变量名兼容两种写法：GAODE_MAP_KEY 或源项目风格的 NEXT_PUBLIC_GAODE_MAP_KEY
        NEXT_PUBLIC_GAODE_MAP_KEY: ${GAODE_MAP_KEY:-${NEXT_PUBLIC_GAODE_MAP_KEY:-}}
        NEXT_PUBLIC_GAODE_MAP_SECURITY_KEY: ${GAODE_MAP_SECURITY_KEY:-${NEXT_PUBLIC_GAODE_MAP_SECURITY_KEY:-}}
    container_name: housing-map-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:3007"
    environment:
      - NODE_ENV=production
      # 实际 fetch 走 nginx 相对路径 /api/map/*，此变量仅为运行时占位（对齐 macro）
      - NEXT_PUBLIC_API_BASE_URL=/
    networks:
      - app-net
    depends_on:
      housing-map-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # skill-manager 后端（Skill 发布管理台，backend/skill-manager/）
  # 挂载边界：Skill 源库 / GitHub 缓存 / 默认 skills / profiles 父目录 / state
  # profiles 父目录一次性挂载，后续 profile 的 skills 无需逐项补挂载。
  # ---------------------------------------------------------------------------
  skill-manager-backend:
    build:
      context: ./backend/skill-manager
    container_name: skill-manager-backend
    restart: unless-stopped
    expose:
      - "8097"
    volumes:
      - ${SKILLS_SOURCE_HOST_PATH:?skill-manager requires SKILLS_SOURCE_HOST_PATH}:${SKILLS_SOURCE_HOST_PATH:?}:rw
      - ${GITHUB_SKILL_CACHE_HOST_PATH:?skill-manager requires GITHUB_SKILL_CACHE_HOST_PATH}:${GITHUB_SKILL_CACHE_HOST_PATH:?}:rw
      - type: bind
        source: ${HERMES_SKILLS_HOST_PATH:-/home/ohyes768/.hermes/skills}
        target: ${HERMES_SKILLS_HOST_PATH:-/home/ohyes768/.hermes/skills}
        bind:
          create_host_path: false
      - type: bind
        source: ${HERMES_PROFILES_HOST_PATH:-/home/ohyes768/.hermes/profiles}
        target: ${HERMES_PROFILES_HOST_PATH:-/home/ohyes768/.hermes/profiles}
        bind:
          create_host_path: false
      - skill-manager-state:/app/state
      - ./deploy/fastgithub-ca.pem:/etc/ssl/fastgithub-ca.pem:ro
    environment:
      - TZ=Asia/Shanghai
      - SKILLS_SOURCE_ROOT=${SKILLS_SOURCE_HOST_PATH:-}
      - GITHUB_SKILL_CACHE_ROOT=${GITHUB_SKILL_CACHE_HOST_PATH:-}
      - HERMES_SKILLS_ROOT=${HERMES_SKILLS_HOST_PATH:-/home/ohyes768/.hermes/skills}
      - SKILL_MANAGER_HERMES_PROFILES_ROOT=${HERMES_PROFILES_HOST_PATH:-/home/ohyes768/.hermes/profiles}
      - SKILL_MANAGER_HERMES_TARGETS=${SKILL_MANAGER_HERMES_TARGETS:-}
      - SKILL_MANAGER_STATE_DIR=/app/state
      - HTTPS_PROXY=http://host.docker.internal:38458
      - HTTP_PROXY=http://host.docker.internal:38458
      - NO_PROXY=localhost,127.0.0.1
      - GIT_SSL_CAINFO=/etc/ssl/fastgithub-ca.pem
      - SKILL_MANAGER_ADMIN_PASSWORD=${SKILL_MANAGER_ADMIN_PASSWORD:-}
      - SKILL_MANAGER_SERVICE_PORT=${SKILL_MANAGER_SERVICE_PORT:-8097}
    networks:
      - app-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${SKILL_MANAGER_SERVICE_PORT:-8097}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # skill-manager 前端（Next.js 15，basePath='/skills'，apps/skill-manager/）
  # ---------------------------------------------------------------------------
  skill-manager-frontend:
    image: skill-manager-frontend:latest
    build:
      context: ./apps/skill-manager
      dockerfile: Dockerfile
    container_name: skill-manager-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:3008"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
    networks:
      - app-net
    depends_on:
      skill-manager-backend:
        condition: service_healthy


  kids-catalog-backend:
    build: { context: ./backend/kids-catalog }
    container_name: kids-catalog-backend
    restart: unless-stopped
    expose: ["8098"]
    volumes:
      - kids-catalog-data:/app/data
      - ${KIDS_MUSIC_HOST_PATH:-/home/ohyes768/xiaomusic/music}:/music:rw
    # XM_* 喜马拉雅开放平台凭据（根目录 .env 提供）；缺失时回退网页采集，不影响启动
    environment: [TZ=Asia/Shanghai, KIDS_DATA_DIR=/app/data, KIDS_MUSIC_DIR=/music,
                  "XM_APP_KEY=${XM_APP_KEY:-}", "XM_APP_SECRET=${XM_APP_SECRET:-}",
                  "KIDS_MA_URL=${KIDS_MA_URL:-}", "KIDS_MA_TOKEN=${KIDS_MA_TOKEN:-}",
                  "KIDS_MA_MUSIC_ROOT=${KIDS_MA_MUSIC_ROOT:-/music}"]
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  kids-catalog-frontend:
    image: kids-catalog-frontend:latest
    container_name: kids-catalog-frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3009:3009"]
    build:
      context: ./apps/kids-catalog
      args: { KIDS_BACKEND_URL: http://kids-catalog-backend:8098 }
    networks: [app-net]
    depends_on:
      kids-catalog-backend: { condition: service_healthy }


  # ---------------------------------------------------------------------------
  # index-trends 后端（宽基趋势观察：沪深300线性回归通道）
  # ---------------------------------------------------------------------------
  index-trends-backend:
    build: { context: ./backend/index-trends }
    container_name: index-trends-backend
    restart: unless-stopped
    expose: ["8100"]
    volumes:
      - index-trends-data:/app/data
    # 每日行情和估值刷新由 Web 服务负责；简报定时与投递由 Hermes 负责。
    # INDEX_TRENDS_LIXINGER_TOKEN 为理杏仁访问令牌（沪深300 PE-TTM 近10年分位）；
    # 未配置时不发起理杏仁请求，查询接口返回估值 disabled。
    # INDEX_TRENDS_VALUATION_REFRESH_CRON 为每日估值采集时间（Asia/Shanghai），
    # 与 16:30 行情刷新独立；交易日历确认休市时该任务跳过不发请求
    environment: [TZ=Asia/Shanghai, INDEX_TRENDS_DATA_DIR=/app/data,
                  "INDEX_TRENDS_LIXINGER_TOKEN=${INDEX_TRENDS_LIXINGER_TOKEN:-}",
                  "INDEX_TRENDS_VALUATION_REFRESH_CRON=${INDEX_TRENDS_VALUATION_REFRESH_CRON:-30 18 * * mon-fri}"]
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  index-trends-frontend:
    image: index-trends-frontend:latest
    container_name: index-trends-frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3010:3010"]
    build:
      context: ./apps/index-trends
      args: { INDEX_TRENDS_API_ORIGIN: http://index-trends-backend:8100 }
    networks: [app-net]
    depends_on:
      index-trends-backend: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # stock-info 业务镜像（build-only，方案 B：脚本+依赖由业务仓库自维护）
  # ---------------------------------------------------------------------------
  # 不承载运行时容器：entrypoint true，up 时创建即退出；仅用于
  # `docker compose build stock-info-image`（deploy-nas.sh task-web 会前置调用）
  # deploy-nas.sh task-web 的打包顺序：先在 $STOCK_INFO_HOST_PATH 的 checkout 上
  # git pull --ff-only（--no-pull 时跳过），再构建本镜像，保证镜像与业务仓库代码同源同版本。
  stock-info-image:
    image: stock-info:latest
    container_name: stock-info-image
    restart: "no"
    entrypoint: ["true"]
    build:
      context: ${STOCK_INFO_HOST_PATH:-/home/ohyes768/stock-info-dingding}

  # AI 任务触发镜像（build-only，与 stock-info-image 同款）：镜像内是
  # backend/task-web/trigger/hermes_trigger.py + requests，由 task-web 的 docker
  # 引擎按次拉起执行 13 个 AI 任务（tasks.yaml 中 image: hermes-trigger:latest）。
  # 这是 task-web 的执行基础设施，与本仓外的业务仓库无关，故 context 在本仓内。
  # deploy-nas.sh task-web（side=backend/both）会前置调用
  # `docker compose build hermes-trigger-image`，保证镜像与 trigger 源码同源。
  hermes-trigger-image:
    image: hermes-trigger:latest
    container_name: hermes-trigger-image
    restart: "no"
    entrypoint: ["true"]
    build:
      context: ./backend/task-web/trigger

  # ---------------------------------------------------------------------------
  # task-web 后端（定时任务管理：调度 + 执行记录 + 日志）
  # ---------------------------------------------------------------------------
  task-web-backend:
    build: { context: ./backend/task-web }
    container_name: task-web-backend
    restart: unless-stopped
    expose: ["8101"]
    volumes:
      - task-web-data:/app/data
      # 业务仓库挂载：脚本类任务 env_file 读取来源（docker 引擎的代码在业务镜像内）
      - "${TASK_WEB_WORKSPACE_HOST_PATH:-/home/ohyes768/stock-info-dingding}:/workspace/stock-info-dingding"
      # Hermes profile 凭证（gw-8642/8643.env）只读挂载；AI 任务 env_file 指向这里
      - "${HERMES_HOME_HOST_PATH:-/home/ohyes768/.hermes}:/hermes-home:ro"
      # docker 引擎经 SDK 走 socket 按次拉起业务镜像（方案 B）。
      # 边界：docker.sock 等价宿主机 root 权限，NAS 单用户自用环境接受
      - /var/run/docker.sock:/var/run/docker.sock
    # TASK_WEB_ADMIN_PASSWORD：手动执行密码（未配置则手动执行禁用，fail closed）
    # 任务导入默认禁用（enabled=0），验证后页面手动启用，避免双调度器重复发送
    environment: [TZ=Asia/Shanghai,
                  "TASK_WEB_ADMIN_PASSWORD=${TASK_WEB_ADMIN_PASSWORD:-}",
                  # Hermes profile 目录覆盖（JSON）；留空用代码内默认
                  # default → .env.hermes-default + ~/.hermes/cron，ohyes768 → .env + profiles/ohyes768/cron
                  "TASK_WEB_HERMES_PROFILES=${TASK_WEB_HERMES_PROFILES:-}",
                  TASK_WEB_DB_PATH=/app/data/taskweb.sqlite3,
                  TASK_WEB_LOG_DIR=/app/data/logs,
                  TASK_WEB_WORKSPACE_ROOT=/workspace]
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  task-web-frontend:
    image: task-web-frontend:latest
    container_name: task-web-frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3011:3011"]
    build:
      context: ./apps/task-web
      args: { TASK_WEB_API_ORIGIN: http://task-web-backend:8101 }
    networks: [app-net]
    depends_on:
      task-web-backend: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # service-manager（NAS 服务台账：容器发现 + 端口域名证书 + 发布动态）
  # Docker 只读走 socket-proxy：后端不挂 docker.sock，也不挂宿主目录。
  # ---------------------------------------------------------------------------
  service-manager-socket-proxy:
    # 只开 CONTAINERS/PING/VERSION，POST=0 → 仅 GET/HEAD 能到达 Engine。
    #
    # 锁 digest：这是全仓唯一摸得到 docker.sock 的容器（只读挂载），镜像被换
    # 等于门卫换内贼——恶意版本可以无视 POST=0 等环境变量直接全放行。
    # tag 可移动，digest 不可；两者都写，digest 说了算，tag 只当注释。
    # 0.2.0 / 2024-07-09 构建 / linux-amd64，digest 取自 pull 时仓库写入的 RepoDigest。
    # 升级时手动换 digest，并重跑 §权限探针（见 docs/service-manager-nas-setup.md）。
    image: tecnativa/docker-socket-proxy:0.2.0@sha256:083bd0ed8783e366d745f332f0e4489816dd35d984bef8f16e6d89484a22c082
    container_name: service-manager-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - PING=1
      - VERSION=1
      - POST=0
      - IMAGES=0
      - INFO=0
      - EVENTS=0
      - NETWORKS=0
      - VOLUMES=0
      - EXEC=0
      - SECRETS=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
    volumes:
      # 只有这个容器挂 socket，且只读挂载；API 层只读由 POST=0 保证
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sm-docker-net]
    # 不发布任何主机端口；不接入 app-net

  service-manager-backend:
    build: { context: ./backend/service-manager }
    container_name: service-manager-backend
    restart: unless-stopped
    expose: ["8102"]
    volumes:
      - service-manager-data:/app/data
    environment: [TZ=Asia/Shanghai,
                  "SERVICE_MANAGER_ADMIN_PASSWORD=${SERVICE_MANAGER_ADMIN_PASSWORD:?service-manager 需要管理口令}",
                  "SERVICE_MANAGER_SESSION_SECRET=${SERVICE_MANAGER_SESSION_SECRET:?service-manager 需要会话签名密钥}",
                  "SERVICE_MANAGER_PUBLIC_ORIGIN=${SERVICE_MANAGER_PUBLIC_ORIGIN:-https://web.duomi77.cn:9443}",
                  # 允许的额外写请求来源。默认带上前端容器的回环入口：直连
                  # 127.0.0.1:3012（SSH 隧道、e2e）时 Next rewrite 会把 Host 改写成
                  # 后端地址，后端按 Origin==Host 判同源就会拒掉写操作；生产走 nginx
                  # 时 nginx 原样透传 Host，走同一条判定的第 1 条路径，不受影响。
                  "SERVICE_MANAGER_ALLOWED_ORIGINS=${SERVICE_MANAGER_ALLOWED_ORIGINS:-http://127.0.0.1:3012,http://localhost:3012}",
                  "SERVICE_MANAGER_GITHUB_TOKEN=${SERVICE_MANAGER_GITHUB_TOKEN:-}",
                  "SERVICE_MANAGER_DOCKER_HOST=tcp://service-manager-socket-proxy:2375",
                  SERVICE_MANAGER_DATA_DIR=/app/data,
                  SERVICE_MANAGER_SECURE_COOKIE=true,
                  SERVICE_MANAGER_SERVICE_PORT=8102]
    networks: [app-net, sm-docker-net]
    depends_on:
      - service-manager-socket-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  service-manager-frontend:
    image: service-manager-frontend:latest
    container_name: service-manager-frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3012:3012"]
    build:
      context: ./apps/service-manager
      args: { SERVICE_MANAGER_API_ORIGIN: http://service-manager-backend:8102 }
    networks: [app-net]
    depends_on:
      service-manager-backend: { condition: service_healthy }
# =============================================================================
# 网络 & 数据卷
# =============================================================================
networks:
  app-net:
    name: nginx_nginx-bridge
    external: true
  # service-manager 专用：只有 socket-proxy 与后端接入，internal 不允许出网
  sm-docker-net:
    name: service-manager-docker-net
    internal: true

volumes:
  dividend-data:
    name: dividend-data
  dividend-logs:
    name: dividend-logs
  dividend-config:
    name: dividend-config
  douyin-data:
    name: douyin-data
  douyin-logs:
    name: douyin-logs
  rss-relay-data:
    name: rss-relay-data
  macro-data:
    name: macro-data
  macro-logs:
    name: macro-logs
  fund-select-data:
    name: fund-select-data
  fund-select-cache:
    name: fund-select-cache
  fund-select-logs:
    name: fund-select-logs
  housing-map-data:
    name: housing-map-data
  housing-map-logs:
    name: housing-map-logs
  skill-manager-state:
    name: skill-manager-state
  kids-catalog-data:
    name: kids-catalog-data
  index-trends-data:
    name: index-trends-data
  task-web-data:
    name: task-web-data
  service-manager-data:
    name: service-manager-data
