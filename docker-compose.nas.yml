# =============================================================================
# 个人财富网站 - NAS 部署统一编排
# =============================================================================
# 用途：Ubuntu Server NAS 部署 8 个服务（4 个后端 + 4 个前端）
# 用法：
#   1. 准备 .env：在仓库根目录创建 .env，填入阿里云 key（已被 .gitignore 忽略）
#        cat > .env << 'EOF'
#        DIVIDEND_ALIYUN_ACCESS_KEY=你的key
#        DOUYIN_ALIYUN_ACCESS_KEY=你的key
#        RSS_RELAY_TOKEN=随机字符串
#        FRED_API_KEY=FRED数据key
#        ALIRMCOM_APPCODE=阿里云商品数据appcode（可选，留空则商品接口报错）
#        EOF
#   2. 启动：  docker compose -f docker-compose.nas.yml up -d --build
#              （自动读取根目录 .env）
#   3. 验证：  docker compose -f docker-compose.nas.yml ps
#   4. 停止：  docker compose -f docker-compose.nas.yml down
#
# 网络路由（路径式反代，由 NAS 上外部 Nginx 统一对外）：
#   /dividend/*     → dividend-frontend:3003
#   /api/dividend/* → dividend-backend:8092
#   /douyin/*       → douyin-frontend:3004
#   /api/douyin/*   → douyin-backend:8093
#   /rss/*                    → rss-relay-frontend:3006  (列表页)
#   /rss/api/rss-relay/*      → rss-relay-backend:8095/api/*  (freshrss 订阅 + agent 推送)
#   前端 BFF /rss/api/rss-relay/<slug> 已废弃，nginx 直转后端
#   /macro/*     → macro-frontend:3001   (basePath = /macro)
#   /api/macro/*    → macro-frontend:3001   (前端 BFF catch-all 再转 macro-backend:8094/api/*)
#
# 数据卷（用 named volume，docker 自动管理在 /var/lib/docker/volumes/）：
#   dividend-data / dividend-logs / dividend-config
#   douyin-data / douyin-logs
#   rss-relay-data
#   macro-data / macro-logs
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # dividend 后端（A股高股息分析）
  # ---------------------------------------------------------------------------
  dividend-backend:
    build:
      context: ./backend/dividend-select
    container_name: dividend-backend
    restart: unless-stopped
    expose:
      - "8092"
    volumes:
      - dividend-data:/app/data
      - dividend-logs:/app/logs
      - dividend-config:/app/config
    environment:
      - LOG_LEVEL=INFO
      - DIVIDEND_PORT=8092
      - ALIYUN_ACCESS_KEY=${DIVIDEND_ALIYUN_ACCESS_KEY:-}
      - PYWENCAI_COOKIE=${PYWENCAI_COOKIE:-}
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${DIVIDEND_PORT:-8092}/api/dividend/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # dividend 前端（Next.js，basePath 已改为空）
  # ---------------------------------------------------------------------------
  dividend-frontend:
    # 固定镜像名，与 deploy-nas.sh buildx --tag 一致（否则 compose 用项目前缀名，buildx 白打）
    image: dividend-frontend:latest
    build:
      context: ./apps/dividend
      dockerfile: Dockerfile
    container_name: dividend-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
      # BACKEND_URL 不带 /api/dividend 前缀，由 BFF catch-all 路由从 request.url 提取完整路径
      - BACKEND_URL=http://dividend-backend:8092
    networks:
      - app-net
    depends_on:
      dividend-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # douyin 后端（抖音视频文字转写）
  # ---------------------------------------------------------------------------
  douyin-backend:
    build:
      context: ./backend/douyin-processor
    container_name: douyin-backend
    restart: unless-stopped
    expose:
      - "8093"
    volumes:
      - douyin-data:/app/data
      - douyin-logs:/app/logs
      - ./backend/douyin-processor/config:/app/config:ro  # file-system-go 地址可热改，无需 rebuild
    environment:
      - ALIYUN_ACCESS_KEY=${DOUYIN_ALIYUN_ACCESS_KEY:-}
      - DOUYIN_RSS_TOKEN=${DOUYIN_RSS_TOKEN:-}
    networks:
      - app-net
      - n8n-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # douyin 前端（Next.js，basePath 已改为空）
  # ---------------------------------------------------------------------------
  douyin-frontend:
    image: douyin-frontend:latest
    build:
      context: ./apps/douyin
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 是 build-time inline，必须在 build 阶段传
        NEXT_PUBLIC_DOUYIN_RSS_TOKEN: ${DOUYIN_RSS_TOKEN:-}
    container_name: douyin-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
      - DOUYIN_BACKEND_URL=http://douyin-backend:8093/api
      - AWEME_BACKEND_URL=http://douyin-backend:8093/api/aweme
      - NEXT_PUBLIC_DOUYIN_RSS_TOKEN=${DOUYIN_RSS_TOKEN:-}
    networks:
      - app-net
    depends_on:
      douyin-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # rss-relay 后端（个人 RSS 中转：agent 推送 markdown，对外 RSS 2.0 feed）
  # ---------------------------------------------------------------------------
  rss-relay-backend:
    build:
      context: ./backend/rss-relay
    container_name: rss-relay-backend
    restart: unless-stopped
    expose:
      - "8095"
    volumes:
      - rss-relay-data:/app/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RSS_RELAY_TOKEN=${RSS_RELAY_TOKEN:-}
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # rss-relay 前端（Next.js，列表页浏览推送的 markdown）
  # ---------------------------------------------------------------------------
  rss-relay-frontend:
    image: rss-relay-frontend:latest
    build:
      context: ./apps/rss-relay
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 是 build-time inline，必须在 build 阶段传
        NEXT_PUBLIC_RSS_TOKEN: ${RSS_RELAY_TOKEN:-}
    container_name: rss-relay-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
      # BFF 用：把 /api/rss-relay/<path> 转到 http://rss-relay-backend:8095/api/<path>
      - BACKEND_URL=http://rss-relay-backend:8095/api
    networks:
      - app-net
    depends_on:
      rss-relay-backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # macro 后端（全球宏观经济：美/欧/日国债、汇率、VIX、商品、股指、资金流向）
  # backend/macro（FastAPI + FRED + 阿里云商品 API）
  # ---------------------------------------------------------------------------
  macro-backend:
    build:
      context: ./backend/macro
    container_name: macro-backend
    restart: unless-stopped
    expose:
      - "8094"
    volumes:
      - macro-data:/app/data
      - macro-logs:/app/logs
    environment:
      - FRED_API_KEY=${FRED_API_KEY}
      - ALIRMCOM_APPCODE=${ALIRMCOM_APPCODE:-}
      - MACRO_SIGNAL_DATA_DIR=/app/data/macro-signals
      - MACRO_SIGNAL_UPLOAD_TOKEN=${MACRO_SIGNAL_UPLOAD_TOKEN:-}
    networks:
      - app-net
    healthcheck:
      # router prefix = /api，health 端点在 routes.py @router.get("/health")
      test: ["CMD", "curl", "-f", "http://localhost:8094/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # macro 前端（Next.js，basePath = /macro）
  # BFF route.ts: /api/macro/<path> → ${BACKEND_URL}/api/<path>
  # ---------------------------------------------------------------------------
  macro-frontend:
    image: macro-frontend:latest
    build:
      context: ./apps/macro
      dockerfile: Dockerfile
    container_name: macro-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
      # 不带 /api 前缀，BFF catch-all 自己拼 /api/<path>
      - BACKEND_URL=http://macro-backend:8094
    networks:
      - app-net
    depends_on:
      macro-backend:
        condition: service_healthy

# =============================================================================
# 网络 & 数据卷
# =============================================================================
networks:
  app-net:
    name: nginx_nginx-bridge
    external: true
  n8n-net:
    name: n8n_default
    external: true

volumes:
  dividend-data:
    name: dividend-data
  dividend-logs:
    name: dividend-logs
  dividend-config:
    name: dividend-config
  douyin-data:
    name: douyin-data
  douyin-logs:
    name: douyin-logs
  rss-relay-data:
    name: rss-relay-data
  macro-data:
    name: macro-data
  macro-logs:
    name: macro-logs
