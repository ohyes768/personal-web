# =============================================================================
# skill-manager（Skill 发布管理台）服务定义 —— overlay 文件
# 由 scripts/deploy-nas.sh 仅在 target=skill-manager|all 时叠加加载：
#   docker compose -f docker-compose.nas.yml -f docker-compose.skill-manager.nas.yml ...
# 单独成文件的原因：compose 的变量插值与卷规格校验是全文件的，若放在基础
# 文件里，skill-manager 的必填 .env 变量（管理密码、NAS 挂载路径）会卡住
# 其他所有 target 的 build/up。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # skill-manager 后端（Skill 发布管理台，backend/skill-manager/）
  # 挂载边界（R6）：仅 Skill 源库 / GitHub 缓存 / 两个 Agent 目标目录 / state，
  # 不挂 docker.sock、宿主根或任何无关目录；管理密码只注入本服务
  # 同路径 bind mount：发布的 symlink 落在宿主机技能目录、由宿主机 agent
  # 消费，symlink target 必须是宿主机真实路径——两侧用同一宿主路径后，
  # 容器内校验与宿主机解析天然一致
  # ---------------------------------------------------------------------------
  skill-manager-backend:
    build:
      context: ./backend/skill-manager
    container_name: skill-manager-backend
    restart: unless-stopped
    expose:
      - "8097"
    volumes:
      - ${SKILLS_SOURCE_HOST_PATH}:${SKILLS_SOURCE_HOST_PATH}:rw
      - ${GITHUB_SKILL_CACHE_HOST_PATH}:${GITHUB_SKILL_CACHE_HOST_PATH}:rw
      - ${OPENCLAW_SKILLS_HOST_PATH}:${OPENCLAW_SKILLS_HOST_PATH}:rw
      - ${HERMES_SKILLS_HOST_PATH}:${HERMES_SKILLS_HOST_PATH}:rw
      - skill-manager-state:/app/state
      # FastGithub MITM 根证书：容器内 git 校验 github.com 证书链必需
      # （宿主机 proxy_on 输出 issuer=FastGithub 即 MITM 模式）。文件由
      # NAS 侧放置（见 .gitignore，机器自生成不入库），缺失会导致 clone 报错
      - ./deploy/fastgithub-ca.pem:/etc/ssl/fastgithub-ca.pem:ro
    environment:
      - TZ=Asia/Shanghai
      - SKILLS_SOURCE_ROOT=${SKILLS_SOURCE_HOST_PATH}
      - GITHUB_SKILL_CACHE_ROOT=${GITHUB_SKILL_CACHE_HOST_PATH}
      - OPENCLAW_SKILLS_ROOT=${OPENCLAW_SKILLS_HOST_PATH}
      - HERMES_SKILLS_ROOT=${HERMES_SKILLS_HOST_PATH}
      - SKILL_MANAGER_STATE_DIR=/app/state
      # 两个 target 根分属不同宿主目录，无共同挂载父级；
      # 容器可见文件系统边界由上述 bind mount 白名单保证
      # GitHub 走宿主机 FastGithub 代理（仅监听 127.0.0.1，由宿主机 socat
      # 转发到 docker0 的 172.17.0.1，见 deploy/README-fastgithub.md）；
      # NO_PROXY 保护 healthcheck 的 localhost 请求不吃代理
      - HTTPS_PROXY=http://host.docker.internal:38457
      - HTTP_PROXY=http://host.docker.internal:38457
      - NO_PROXY=localhost,127.0.0.1
      - GIT_SSL_CAINFO=/etc/ssl/fastgithub-ca.pem
      # 必填：缺失时 compose 拒绝启动，避免密码为空的服务上线
      # （config.py 另有非空校验兜底，覆盖不经 compose 的本地启动路径）
      - SKILL_MANAGER_ADMIN_PASSWORD=${SKILL_MANAGER_ADMIN_PASSWORD:?set SKILL_MANAGER_ADMIN_PASSWORD in .env}
    networks:
      - app-net
    extra_hosts:
      # 容器内访问宿主机 FastGithub 代理（127.0.0.1:38457）的固定入口
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${SKILL_MANAGER_SERVICE_PORT:-8097}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # skill-manager 前端（Next.js 15，basePath='/skills'，apps/skill-manager/）
  # API 请求不经前端：nginx 把 /api/skills/* 原样直转 skill-manager-backend
  # （见 nginx/web.conf）；本服务绝不注入 SKILL_MANAGER_ADMIN_PASSWORD
  # ---------------------------------------------------------------------------
  skill-manager-frontend:
    image: skill-manager-frontend:latest
    build:
      context: ./apps/skill-manager
      dockerfile: Dockerfile
    container_name: skill-manager-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:3008"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/
    networks:
      - app-net
    depends_on:
      skill-manager-backend:
        condition: service_healthy

volumes:
  skill-manager-state:
    name: skill-manager-state
