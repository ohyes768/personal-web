[project]
name = "daily-review"
version = "0.1.0"
description = "每日工作回顾服务后端（FastAPI + SQLite，汇聚两机 DSH 会话/任务板/git commit，LLM 日报周报）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "zstandard>=0.22.0",
    "python-dotenv>=1.0.0",
    # llm.py 运行时调 DeepSeek 用（不只 dev）
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# 应用而非库：不打包安装，uvicorn 从项目根目录直接跑 src.main:app
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
