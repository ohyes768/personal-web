app:
  # 服务器配置
  server:
    host: "0.0.0.0"
    port: 8093

  # 共享音频目录（v3: 2026-11-25 去掉 file-system-go，collector 直写宿主目录，
  # 容器挂载为 /app/audio；LocalAudioStore 扫描/读取/删除都在这个目录）
  audio_store:
    dir: "/app/audio"

  # 文件配置
  files:
    output_dir: "data/output"
    status_file: "data/status.json"

  # ASR配置（本机 FunASR 容器，SenseVoiceSmall）
  # 注：2026-11-25 从阿里云百炼 dashscope 切换过来，本地推理免费；
  # SenseVoice 只输出纯文本，无分段时间戳/置信度（单段全文）
  asr:
    provider: "local-funasr"
    base_url: "http://funasr-asr:8000"   # 容器网络地址（douyin-backend 已接入 funasr-asr_default 网络）
    timeout: 600                          # CPU 推理超时（长音频放宽）

  # 日志配置
  logging:
    level: "INFO"
    console: true
    file: true
    dir: "logs"

  # RSS 订阅源（v1.0）
  # token 走 DOUYIN_RSS_TOKEN 环境变量，app.yaml 不写
  rss:
    # channel 元数据
    channel:
      title: "抖音视频文字稿"
      # 公网域名（已确认 = web.duomi77.cn:9443）
      link: "https://web.duomi77.cn:9443"
      description: "通过 douyin-processor 自动转写的抖音视频文字稿"
    # 限制
    max_items: 200            # 硬上限
    default_limit: 50         # 默认 limit

  # 定时清理（删 N 天前的 .wav 源文件 + status.json 记录）
  # 行为：复用 POST /api/aweme/cleanup 同样的清理逻辑,纯异步触发
  cleanup:
    days: 45                  # 清理阈值（天）
    cron: "7 3 * * *"         # 每天 03:07 北京时间（跟 rss-relay 03:03 错开 4 分钟）
    timezone: "Asia/Shanghai"

  # 定时 process_pending:每天 09:45 / 17:15 北京时间自动处理 status=pending 视频
  # 之前由 n8n 外部定时触发,改为后端 APScheduler 自调度,降低对外部服务依赖
  # 与 cleanup 共用同一个 AsyncIOScheduler 实例,共用 endpoints._process_lock 防重入
  process_pending:
    cron_morning: "45 9 * * *"    # 每天 09:45 北京时间
    cron_evening: "15 17 * * *"   # 每天 17:15 北京时间
    timezone: "Asia/Shanghai"
