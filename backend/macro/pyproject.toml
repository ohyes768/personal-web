[project]
name = "macro"
version = "1.0.0"
description = "全球宏观经济债券利率数据服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pandas>=2.2.0",
    "fredapi>=0.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "akshare>=1.14.0",
    "tenacity>=8.2.0",
    "apscheduler>=3.10,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: 单元测试（mock 外部依赖，速度快）",
    "integration: 集成测试",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
