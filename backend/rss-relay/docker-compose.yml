services:
  rss-relay-backend:
    build:
      context: .
    container_name: rss-relay-backend
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - LOG_LEVEL=INFO
      - RSS_RELAY_TOKEN=${RSS_RELAY_TOKEN:-}
      - RSS_RELAY_PUBLIC_FEED_URL=${RSS_RELAY_PUBLIC_FEED_URL:-https://web.duomi77.cn:9443/rss/api/rss-relay/rss.xml}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
