[project]
name = "rss-relay"
version = "1.0.0"
description = "个人 RSS 中转：agent 推送 markdown，对外提供 RSS 2.0 feed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "markdown>=3.7",
    "apscheduler>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
