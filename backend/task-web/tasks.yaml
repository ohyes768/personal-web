  - id: hermes-waytoagi-tracker
    name: WaytoAGI更新日志追踪（Hermes）
    group: ai
    description: waytoagi-update-log skill，推 RSS Relay+钉钉群机器人（已核实 prompt 内置双通道推送）（job adad4bb38199）
    targets: [rss, dingtalk]
    engine: docker
    image: hermes-trigger:latest
    command: python hermes_trigger.py --job-id adad4bb38199
    prompt: |-
      追踪 WaytoAGI 知识库近 7 日更新日志，整理今天（按 Asia/Shanghai 时区）的文章列表（标题 + 说明 + 飞书 Wiki 链接 + 微信原文链接），按 Step 1-5 流程执行，并把结果推送到 **RSS Relay** 和 **钉钉群机器人**。如果今天无更新则返回 [SILENT]。

      ## 推送目标（只有两个，都不经过 IM 通道）

      本 cron 的 `deliver=local`，**不会投递到飞书/微信/任何 IM**。最终回复只落本地文件，不外发。推送靠下面两条通道：

      1. **RSS Relay** —— 由 skill 内部按 Step 6 执行，每篇文章一条 POST（`--source waytoagi-daily`，`channel` 固定 `waytoagi`）
      2. **钉钉群机器人** —— 必须由 agent **显式调用脚本**推送

      两个目标互不替代，**都要发**。

      ### 钉钉推送步骤

      有文章时，在写 final response **之前**执行：

      ```bash
      cd ~/.hermes/skills/waytoagi-update-log && \
      node scripts/send_dingtalk.js \
        "$(grep ^DINGTALK_WEBHOOK .env | cut -d= -f2-)" \
        "$(cat /tmp/waytoagi-dingtalk.md)"
      ```

      其中 `/tmp/waytoagi-dingtalk.md` 是本次要推的日报 markdown（**必须先写到该文件**）。格式要求：

      - **正文第一行必须包含 `WaytoAGI` 这个词** —— 钉钉机器人配置了关键词安全校验，正文/标题里不含 `WaytoAGI` 会被直接拒绝（`errcode:310000 关键词不匹配`）。`send_dingtalk.js` 的 markdown title 硬编码为 `WaytoAGI 更新日报`，标题已满足要求；正文首行仍建议写成 `## 📅 WaytoAGI 更新日志 · X月X日 更新 N 篇` 双重保险
      - 文章条目之间用 `---` 分隔
      - 标题、说明、链接之间用空行分隔
      - 每篇的链接：微信来源 → 微信原文链接（优先）+ 飞书 Wiki 作备；非微信来源 → 直接用飞书 Wiki 链接

      ### 成功判定

      - 脚本输出 `发送成功: {"errcode":0,"errmsg":"ok"}` = 钉钉推送成功
      - 若报 `钉钉返回错误: 关键词不匹配` → 正文缺 `WaytoAGI` 关键词，**补上关键词后重试一次**，不要反复重试
      - **钉钉推送失败不能阻断 RSS 推送和 final response** —— 两个目标（钉钉 / RSS）任一失败，其余照常执行，最后在 final response 里说明哪个失败了

      ## 硬规则

      - 不要调用 `clarify` 或任何交互式工具（cron 场景无用户在场）
      - **不要**尝试向飞书或微信发送任何消息（`deliver=local`，没有 IM 投递）
      - 工具调用预算 ≤ 30 次
      - 完整 Markdown 报告仍按 SKILL.md Step 5 落 `~/.hermes/cron/output/`，RSS 仍按 Step 6 每篇一条 POST
      - final response 保持简洁（≤ 500 字），完整报告已落盘 + 已推 RSS / 钉钉，不要复述全文
    skills: [waytoagi-update-log]
    env_file: /hermes-home/gw-8642.env
    network: nginx_nginx-bridge
    cron: "0 10 * * *"
    timeout: 3600

