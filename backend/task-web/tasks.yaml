  - id: hermes-hk-ipo-backtest
    name: 港股IPO回测审计（Hermes）
    group: ai
    description: hk-ipo-backtest skill，推 RSS（已核实 prompt 内置推送步骤）（job f6ce56ef2c94）
    targets: [rss]
    engine: docker
    image: hermes-trigger:latest
    command: python hermes_trigger.py --job-id f6ce56ef2c94
    prompt: |-
      使用 hk-ipo-backtest skill 跑每日港股 IPO 回测审计，按 references/report-contract.md 生成最终 Markdown 并推送到 RSS：

      ## 工作流程

      1. 确认今天是香港交易日，且港股已正常收市（hour >= 16）
      2. 找出今天完成首日交易的港股 IPO（排除转板、介绍上市、ETF、债券）
      3. 逐只回到“公开招股截止日前一天 23:59:59 (Asia/Hong_Kong)”的预测截止点
      4. 重建当时候选全集，调用 hk-ipo-research skill
      5. **财务和股东字段**按 references/financial-research.md 和 references/ownership-research.md 实时全网搜（不依赖 HKEX PDF）
      6. 冻结预测快照（候选列表 + 输入来源 + 评分 + 排名 + 方向 + 置信度 + 理由）
      7. 解锁后读取真实结果（最终发售价、暗盘、上市首日开盘/最高/最低/收盘）
      8. 按 references/report-contract.md 输出：暗盘方向是否命中、首日开盘方向是否命中、推荐股票表现、高分破发反例、低分上涨反例
      9. **每只独立**生成 Markdown，路径 `~/.hermes/cron/output/hk-ipo-backtest-{YYYY-MM-DD}-{code}.md`
      10. **重要**：生成 Markdown 后**立即调用** push_rss.py：

      ```bash
      python3 ~/.hermes/skills/hk-ipo-research/scripts/push_rss.py <md-path> \
        --report-type backtest \
        --title "YYYY-MM-DD 港股IPO回测｜公司名（00000.HK）｜预测命中" \
        --endpoint https://web.duomi77.cn:9443/rss/api/rss-relay/post \
        --source hk-ipo-backtest \
        --insecure
      ```

      11. 当天有 N 只成熟案例就推送 N 篇；无成熟案例则不推送。
      12. 结论只能是 `预测命中` / `部分命中` / `预测未命中`。
      13. 财务/股东字段未找到时 RSS 会告警但默认继续推；如想强制门禁，追加 `--strict`。

      不要超过 20 分钟。**严禁未来数据泄漏**。工具调用预算 ≤ 30 次。
    skills: [hk-ipo-backtest]
    env_file: /hermes-home/gw-8642.env
    network: nginx_nginx-bridge
    cron: "0 16 * * mon-fri"
    timeout: 3600

