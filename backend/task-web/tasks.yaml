# task-web 预登记任务清单（Web 端不能新增任意命令，只能改调度）
# cwd 相对 TASK_WEB_WORKSPACE_ROOT（容器内 /workspace）；导入默认禁用，验证后手动启用
#
# 约束提醒：engine=docker 按次拉起业务镜像、不挂任何 volume，
# 因此这里只登记「纯推送、不依赖本地状态文件」的脚本。
# 依赖 data/*.json 或 data/*.db 的脚本（daily_pick / rss / xwlb）暂不接入。
# 2026-11-06 cutover：以下 8 条已启用，n8n 上对应触发器已停用（Gold/Fund/New Stock
# 整工作流 unpublish；Stock info Push 保留 17:30 财报选股触发器）。
tasks:
  # ---- stock-info-dingding 纯推送任务（方案 B：业务镜像独立维护）----
  # 前置：NAS 上 cd /home/ohyes768/stock-info-dingding && docker build -t stock-info:latest .
  # 注意：会真实推送钉钉！启用前确认 n8n 上同名定时已停用，否则钉钉收双份。

  # 迁移来源：n8n「New Stock Push」09:10 A股
  - id: a-stock-push
    name: A股新股通知
    description: stock-info-dingding 新股抓取与钉钉推送（真实外发，启用前必须验证）
    engine: docker
    image: stock-info:latest
    command: python a_stock_push.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "10 9 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「New Stock Push」09:15 港股
  - id: hk-stock-push
    name: 港股新股通知
    description: 港股新股抓取与钉钉推送
    engine: docker
    image: stock-info:latest
    command: python hk_stock_push.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "15 9 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「Stock info Push」11:30 + 14:30 板块涨跌（两触发器合并为逗号 cron）
  - id: sector-push
    name: 板块涨跌播报
    description: 东方财富板块涨跌 → 钉钉（11:30、14:30 两档）
    engine: docker
    image: stock-info:latest
    command: python dingtalk_em_api.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "30 11,14 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「Gold Price Push」09:30 + 15:30
  - id: gold-price-push
    name: 黄金价格推送
    description: 黄金价格播报（09:30、15:30 两档）
    engine: docker
    image: stock-info:latest
    command: python gold_price_push.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "30 9,15 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「Fund M120 Push」14:40
  - id: fund-m120-push
    name: 基金M120推送
    description: 监控基金 M120 均线信号推送
    engine: docker
    image: stock-info:latest
    command: python fund_m120_push.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "40 14 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「Stock info Push」14:35 科创50（分钟与 16:30 不同，拆两条任务）
  - id: star50-macd-push
    name: 科创50 MACD推送
    description: 科创50 指数 MACD 信号推送（14:35 档）
    engine: docker
    image: stock-info:latest
    command: python star50_macd_push.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "35 14 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「Stock info Push」16:30 科创50（16:30 档）
  - id: star50-macd-push-1630
    name: 科创50 MACD推送(16:30)
    description: 科创50 指数 MACD 信号推送（16:30 档）
    engine: docker
    image: stock-info:latest
    command: python star50_macd_push.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "30 16 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「Stock info Push」17:00 ETF 轮动
  - id: etf-rotation-push
    name: ETF轮动推送
    description: ETF 轮动信号推送
    engine: docker
    image: stock-info:latest
    command: python etf_rotation_push.py
    cwd: /app
    env:
      PUSH_MODE: "1"
    env_file: /workspace/stock-info-dingding/.env
    cron: "0 17 * * mon-fri"
    timeout: 600

  # ---- 2026-11-06 第二批：需挂载宿主目录的任务（volumes/network/user 新能力）----

  # 迁移来源：n8n「Stock info Push」17:30 财报选股
  # 关键点：HERMES_SYNC=1 让主进程同步等完 hermes 分析（一次性容器不能有 detach 子进程）；
  # network=nginx_nginx-bridge 才能连 hermes（只绑该网关 172.27.0.1:8643）；
  # user=1000:1000 保证宿主 data/reports/logs 文件属主与 webhook 容器一致；
  # timeout 2400 > HERMES_TIMEOUT(1800)
  - id: daily-pick-push
    name: 每日财报阅读
    description: 选股推送 + Hermes 财报分析（同步等待），状态落宿主 data/reports/logs
    engine: docker
    image: stock-info:latest
    command: python daily_pick.py
    cwd: /app
    env:
      PUSH_MODE: "1"
      HERMES_SYNC: "1"
      HOME: /tmp
    env_file: /workspace/stock-info-dingding/.env
    volumes:
      - "/home/ohyes768/stock-info-dingding/data:/app/data"
      - "/home/ohyes768/stock-info-dingding/reports:/app/reports"
      - "/home/ohyes768/stock-info-dingding/logs:/app/logs"
    network: nginx_nginx-bridge
    user: "1000:1000"
    cron: "30 17 * * mon-fri"
    timeout: 2400

  # 迁移来源：n8n「RSS Push」14:42 投顾
  - id: rss-tougu-push
    name: RSS推送-每日投顾
    description: RSS 文章推送（tag=每日投顾），去重库 data/rss_articles.db 挂载宿主
    engine: docker
    image: stock-info:latest
    command: python rss/push.py --push-mode 1 --rss-tag 每日投顾
    cwd: /app
    env:
      HOME: /tmp
    env_file: /workspace/stock-info-dingding/.env
    volumes:
      - "/home/ohyes768/stock-info-dingding/data:/app/data"
      - "/home/ohyes768/stock-info-dingding/rss_sources.yaml:/app/rss_sources.yaml:ro"
    user: "1000:1000"
    cron: "42 14 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「RSS Push」17:00 理财
  - id: rss-licai-push
    name: RSS推送-理财
    description: RSS 文章推送（tag=理财），去重库挂载宿主
    engine: docker
    image: stock-info:latest
    command: python rss/push.py --push-mode 1 --rss-tag 理财
    cwd: /app
    env:
      HOME: /tmp
    env_file: /workspace/stock-info-dingding/.env
    volumes:
      - "/home/ohyes768/stock-info-dingding/data:/app/data"
      - "/home/ohyes768/stock-info-dingding/rss_sources.yaml:/app/rss_sources.yaml:ro"
    user: "1000:1000"
    cron: "0 17 * * mon-fri"
    timeout: 600

  # 迁移来源：n8n「RSS Push」17:00 资讯（与理财错开 1 分钟，避免并发写同一个 SQLite）
  - id: rss-zixun-push
    name: RSS推送-资讯
    description: RSS 文章推送（tag=资讯），去重库挂载宿主
    engine: docker
    image: stock-info:latest
    command: python rss/push.py --push-mode 1 --rss-tag 资讯
    cwd: /app
    env:
      HOME: /tmp
    env_file: /workspace/stock-info-dingding/.env
    volumes:
      - "/home/ohyes768/stock-info-dingding/data:/app/data"
      - "/home/ohyes768/stock-info-dingding/rss_sources.yaml:/app/rss_sources.yaml:ro"
    user: "1000:1000"
    cron: "1 17 * * mon-fri"
    timeout: 600

  # ---- Hermes 统一触发试点（11-06-hermes-unified-trigger）----
  # csi300-brief：旧 crontab 35 8 * * 1-5 为 UTC = 北京 16:35；直跑 brief.py
  # （cron_daily.sh 恒 exit 0，失败会被掩盖，不用它）；skills 目录 ro 挂载
  - id: csi300-brief
    name: CSI300盘后简报（钉钉）
    description: csi300-brief skill 盘后简报推送钉钉；原宿主机 crontab 迁移。启用前先禁用旧 crontab 条目
    engine: docker
    image: stock-info:latest
    command: python /hermes-skills/investment-analysis/csi300-brief/scripts/brief.py --push --insecure --only-today
    cwd: /hermes-skills/investment-analysis/csi300-brief
    volumes:
      - "/home/ohyes768/skills:/hermes-skills:ro"
    cron: "35 16 * * 1-5"
    timeout: 900

  # pm25-broadcast：hermes_trigger 读 jobs.json 现场取 prompt → Runs API 提交 →
  # 轮询终态；agent 依 prompt 自行推送微信。启用前先在 Hermes 侧禁用同名旧 job
  - id: pm25-broadcast
    name: 杭州PM2.5播报（微信）
    description: 经 Hermes Runs API 触发 hangzhou-pm25 skill；原 Hermes cron job（id 246c69c1e845）迁移
    engine: docker
    image: stock-info:latest
    command: python hermes_trigger.py --job-id 246c69c1e845
    volumes:
      - "/home/ohyes768/.hermes/cron:/hermes-cron:ro"
    cron: "45 23,3,9 * * *"
    timeout: 2100

  - id: damai-hz-push
    name: 大麦活动-杭州
