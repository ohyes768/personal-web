  # pm25-broadcast：hermes_trigger 读 jobs.json 现场取 prompt → Runs API 提交 →
  # 轮询终态；agent 依 prompt 自行推送微信。启用前先在 Hermes 侧禁用同名旧 job
  # 注意：Hermes cron 存 UTC！jobs.json 里 45 23,3,9 = 北京 7:45/11:45/17:45
  - id: pm25-broadcast
    name: 杭州PM2.5播报（微信）
    group: ai
    description: 经 Hermes Runs API 触发 hangzhou-pm25 skill；原 Hermes cron job（id 246c69c1e845）迁移
    targets: [wechat]
    engine: docker
    image: hermes-trigger:latest
    command: python hermes_trigger.py --job-id 246c69c1e845
    prompt: |-
      查询杭州主城区 PM2.5 当前情况和未来五天变化，生成简报并推送到微信。

      ## 步骤

      1. 运行取数脚本（脚本自带全部取数与计算逻辑，**不要**另找网页数据、不要另抄一套口径）：

      ```bash
      cd /home/ohyes768/skills/environment/hangzhou-pm25 && \
      python3 scripts/hangzhou_pm25.py --output-dir /tmp/hzpm25-$(date -u +%Y%m%d-%H%M)
      ```

      2. 读取生成的 `report.md`（完整版，含五天表格）和同目录的 `report.json`（结构化数据）。

      3. 整理出**最终推送到微信的正文**，按 SKILL.md 的「如何回答」规范：
         - 长度控制在 **120–200 字**，最多 300 字
         - 先说当前浓度 + 观测时间，再说近 24 小时均值相对 WHO 参考值（15 μg/m³）的高低
         - 一句话说后续趋势（哪天变差/变好）
         - 五天表格可以保留，但只在用户需要完整报告时；微信正文优先简短
         - 用大白话（如「风小，污染物不容易散开」），不堆站点明细/风速数字/边界层术语
         - `current.kind=observation` 时说明是周边站点自算均值、非官方全市均值；`model_estimate` 必须说「模型估计，非实测」
         - 不贴「安全」「适合运动」这类标签；PM2.5 单项不等于综合空气质量
         - 保留来源署名（中国环境监测总站 / CAMS/ECMWF / Open-Meteo）

      4. 把完整报告另存到 `~/.hermes/cron/output/hangzhou-pm25/YYYY-MM-DD_HH-MM.md`（文件名用**北京时间**，同名覆盖，不要追加）。

      ## 硬规则

      - **不要**调用 `clarify` 或任何交互式工具（cron 场景无用户在场）
      - **不要**调用 `push_rss.py` 或推任何 RSS / 钉钉（用户只要微信）
      - 脚本退出码 1 表示没有可用 PM2.5 数据 → 此时**如实说明当前数据缺失**，不要编造数值；退出码 2 是参数/文件错误 → 说明错误原因
      - final response 就是**要推送到微信的正文本身**（≤300 字），不要复述流程、不要加「已完成」之类的话
      - 工具调用预算 ≤ 15 次
    skills: [hangzhou-pm25]
    env_file: /hermes-home/gw-8642.env
    network: nginx_nginx-bridge
    cron: "45 7,11,17 * * *"
    timeout: 2100

  # ---- Hermes 任务全量登记（默认禁用；启用前在 Hermes 侧禁用对应旧 job）----
  # 交付已全部核实：5 个任务 prompt/skill 内置推送（RSS 中转服务为主），
  # 不依赖 gateway 的 deliver 会话路由，API 触发不影响投递
  # 默认 profile（gateway 8642，~/.hermes/cron/jobs.json）。2026-11-07 补配：
  # 默认网关有独立 API key（~/.hermes/.env 的 API_SERVER_KEY，stock .env 的 key 仅对 8643 有效），
  # 故 8 条默认任务统一 env_file=.env.hermes-default（8642+default+独立 key，NAS 上已生成 chmod 600）；
  # 且 docker 默认 bridge 实测连不通 172.27.0.1，必须 network: nginx_nginx-bridge 才能达网关
  - id: hermes-hk-ipo-research
    name: 港股IPO每日研究（Hermes）
    group: ai
    description: hk-ipo-research skill，产出推 RSS（已核实 prompt 内置推送步骤）（job 10ef8281a3bd）
    targets: [rss]
    engine: docker
    image: hermes-trigger:latest
    command: python hermes_trigger.py --job-id 10ef8281a3bd
    prompt: |-
      使用 hk-ipo-research skill 跑每日港股打新研究，按 references/report-contract.md 生成最终 Markdown 并推送到 RSS：

      ## 工作流程

      1. 运行 `python3 ~/.hermes/skills/hk-ipo-research/scripts/hkipo.py overview` + `hkex active` 双源看今天仍在招股的港股
      2. 对每只新股运行 `python3 ~/.hermes/skills/hk-ipo-research/scripts/hkipo.py analyze <代码>` + `tradesmart tracker <代码>` 拿孖展数据
      3. **财务和股东字段改用实时全网搜索**（按 references/financial-research.md 和 references/ownership-research.md）：
         - 用公司名 + 关键词组合搜索（AAStocks / 智通财经 / 财联社 / 新浪财经 / 格隆汇 / 界面 / 公司官网）
         - 不要从 HKEX PDF 抓财务/股东（已知失败）
         - 优先找明确引用“招股书/申请版本”的报道，再用第二个独立来源交叉确认
         - 拿不到时仍可推送，但保留 `quality_warnings`
      4. 一次性写 **1 只 = 1 篇 Markdown**，路径 `~/.hermes/cron/output/hk-ipo-daily-{YYYY-MM-DD}-{code}.md`
      5. Markdown 包含 references/report-contract.md 的 8 个二级标题（必备章节尽量齐全）
      6. **重要**：生成 Markdown 后**立即调用** push_rss.py 推送，每只都必须显式带 `--allow-duplicate`（PITFALL #30：批次内第 2-N 只不加会被 relay 误判 duplicate 而丢报告）：

      ```bash
      python3 ~/.hermes/skills/hk-ipo-research/scripts/push_rss.py <md-path> \
        --title "YYYY-MM-DD 港股打新｜公司名（00000.HK）｜66分 B" \
        --endpoint https://web.duomi77.cn:9443/rss/api/rss-relay/post \
        --source hk-ipo-research \
        --insecure \
        --allow-duplicate
      ```

      推送成功后从返回 JSON 里直接取 `detail_url` 字段（relay 已现成拼好 `/view/{id}` 完整链接），**不要自己拼**。若 `detail_url` 为空则用 `id` 字段拼 `https://web.duomi77.cn:9443/rss/view/{id}` 兜底。

      7. 财务字段未找到时，RSS 会告警但默认继续推；如想强制门禁，追加 `--strict`。
      8. 不要合并多只新股；每只独立生成 + 独立推送。
      9. 用中文输出，时间使用 Asia/Hong_Kong。
      10. **工具调用预算**：≤ 30 次；每只新股 ≤ 8 次。

      不要超过 20 分钟。报告存在关键占位符时不得推送。

      ## ⭐ 微信摘要（final response 必填，最后一步）

      所有 push_rss.py 都跑完后，你的 final response（也就是 cron 自动 deliver 到 Home 微信 + 飞书的内容）必须是 **≤ 500 字的极简摘要**，严格按以下格式输出，不要复述报告全文、不要把 Markdown 粘贴进 final response（PITFALL #10a：完整报告约 37000 字符会被切 18 次发 iLink 触发限流）：

      ```
      【YYYY-MM-DD 港股打新｜共 N 只新股】

      • 03228 景旺电子（10.8-10.15 招股）｜62 B-｜现金 1 手｜风险：H1 净利 -25.3%
      • 03757 罗博特科（10.13-10.16 招股）｜35 C｜建议回避｜风险：2025 由盈转亏 -204%

      📄 03228 完整阅读：<detail_url 或 https://web.duomi77.cn:9443/rss/view/{RSS_ID_1}>
      📄 03757 完整阅读：<detail_url 或 https://web.duomi77.cn:9443/rss/view/{RSS_ID_2}>

      ⚠️ 仅为研究参考，不构成认购或买卖建议。
      ```

