# task-web 预登记任务清单（Web 端不能新增任意命令，只能改调度）
# 接入顺序见 .trellis/tasks/11-05-task-web-cron-manager/implement.md Phase 4
# cwd 相对 TASK_WEB_WORKSPACE_ROOT（容器内 /workspace）；导入默认禁用，验证后手动启用
tasks:
  # ---- 无外发测试任务（验收用，永不真实推送）----
  - id: demo-success
    name: 演示-成功任务
    description: 验收用：退出码 0，产生 stdout 日志
    command: echo demo-success && sleep 1 && echo done
    cwd: ""
    cron: "0 9 * * *"
    timeout: 60

  - id: demo-failure
    name: 演示-失败任务
    description: 验收用：非 0 退出码 + stderr 输出
    command: echo about-to-fail && exit 3
    cwd: ""
    cron: "0 9 * * *"
    timeout: 60

  - id: demo-timeout
    name: 演示-超时任务
    description: 验收用：长运行触发超时杀进程组
    command: echo started && sleep 600
    cwd: ""
    cron: "0 9 * * *"
    timeout: 5

  # ---- 首个正式接入（灰度）----
  # 注意：会真实推送钉钉！验证顺序：dry-run → 用户确认 → 启用
  # 不走 run_a_stock.sh：其内嵌 cd /home/ohyes768/... 为宿主机路径，容器内必失败；
  # executor 已按登记 cwd 切好目录，这里等价复刻脚本行为（PUSH_MODE=1 + python）
  - id: a-stock-push
    name: A股新股通知
    description: stock-info-dingding 新股抓取与钉钉推送（真实外发，启用前必须验证）
    command: PUSH_MODE=1 python a_stock_push.py
    cwd: stock-info-dingding
    cron: "0 8 * * *"
    timeout: 600
