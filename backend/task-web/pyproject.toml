[project]
name = "task-web"
version = "0.1.0"
description = "定时任务管理平台后端（FastAPI + APScheduler，预登记任务调度/执行记录/日志）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    # 定时任务：APScheduler 3.x（不要 4.x，API 不兼容）
    "apscheduler>=3.10,<4.0",
    # docker 引擎（方案 B）：经 socket 按次拉起业务镜像，纯 Python SDK 无需容器内 CLI
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

# 应用而非库：不打包安装，uvicorn 从项目根目录直接跑 src.main:app
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
