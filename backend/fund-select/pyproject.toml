[project]
name = "fund-select"
version = "0.1.0"
description = "债基筛选平台后端（31 只精选基金，FastAPI + akshare）"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    # 定时任务：APScheduler 3.x（不要 4.x，API 不兼容）
    "apscheduler>=3.10,<4.0",
    "httpx2[dev]>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

# 应用而非库：不打包安装，uvicorn 从项目根目录直接跑 src.main:app
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ruff 规则集钉在基线 5 类债务（09-04-fix-bond-index-date-shift 清零）。
# 用 select（替换默认集）而非 extend-select（默认集+追加）：ruff 0.16 内置默认集在本项目
# 有 121 处既有告警（UP045×86 / BLE001×11 / B008×8 / I001×4 等），extend-select 会让 CI 全红；
# 修掉它们违背「零行为变更」（UP045 是大面积注解改写、BLE001 动异常语义）。收窄成显式
# 5 类 = 可执行的基线契约。不开 ALL：中文注释触发 RUF002/003，FastAPI Depends 惯用触发 B008。
[tool.ruff.lint]
select = ["F401", "F841", "B017", "SIM117", "RUF059"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
