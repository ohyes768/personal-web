# 业绩比较基准指数映射表（phase2-A）
# 业绩基准公式里的指数名 → akshare 数据源。fetcher 按 name 归一后查此表。
#
# 数据源（2026-09-02 实测，探测脚本 tmp/probe_index_sources*.py / probe_hk_sources.py）：
#   stock_zh_index_daily        新浪，A 股指数（含少量停更陷阱，见各条注释）
#   stock_zh_index_daily_tx     腾讯，A 股 + 港股指数（恒生 hkHSI 1989-至今全历史）
#   bond_index_general_cbond    中债网，中债-综合指数（财富/总值口径）
#     （B1 修复 2026-09-04：旧源 bond_composite_index_cbond 同指数但日期整体 -1 天，换此源，
#      全史 6171 行逐值 0 差值、日期为真实交易日；实证脚本留档任务 research/）
#   index_us_stock_sina         新浪，美股指数（QDII 基准用）
#
# 港股指数源探测结论：东财 em 源 ConnectionError、新浪 hk 源无数据 → 腾讯源可用。
# 恒生综合 hkHSCI 与中证港股通综合（930950）腾讯也无 → 这两个名字仍走 fallback_chain。
#
# 新浪对部分中证指数断更（末条数据 < end-10 天时 fetcher 视为 stale 自动 fallback）：
#   中证红利 sh000922 断于 2019-01、中证800成长 sh000907 断于 2016-06、
#   中证800价值 sh000908 断于 2019-01 —— 这 3 个已改走腾讯源（2026-09-03 实测全量更新）；
#   其余如再遇新浪断更指数，同样改 source 为 stock_zh_index_daily_tx。
#
# 2026-09-04 补录（09-04-benchmark-yaml-coverage，探测脚本留档于任务 research/：probe_index_sources_0904.py）：
#   stock_zh_index_hist_csindex  中证官网（930xxx/H30xxx 等，新浪无源或停更，末条 T-1 新鲜）
#   index_hist_sw                申万行业指数
#   index_hist_cni               国证指数
#   无源指数（探测失败/不达标）走 aliases curated 替代，理由见各条注释。
