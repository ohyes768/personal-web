services:
  dividend-select:
    build: .
    container_name: dividend-select
    restart: unless-stopped
    ports:
      - "8092:8092"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - LOG_LEVEL=INFO
      - DIVIDEND_PORT=8092
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${DIVIDEND_PORT:-8092}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    name: app-network
    driver: bridge