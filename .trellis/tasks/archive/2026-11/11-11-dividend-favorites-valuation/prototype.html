<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>收藏跟踪 · Dividend 交互原型</title>
<style>
:root{--paper:#fbfaf6;--ink:#2b2a28;--muted:#716b63;--line:#e8e3d8;--accent:#a34c2e;--green:#386a4a;--blue:#45627b;--tint:#f3efe6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 'Microsoft YaHei','PingFang SC',sans-serif}button,input{font:inherit}button{cursor:pointer;transition:background .16s,color .16s}button:disabled{cursor:default;opacity:.6}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}::selection{background:#e9c8b7}button{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:7px 13px}button:hover{background:var(--tint)}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#893d25}.link{border:0;background:transparent;padding:5px 0;color:var(--accent)}.link:hover{background:transparent;text-decoration:underline;text-underline-offset:4px}.muted{color:var(--muted)}.num{font-family:Consolas,monospace;font-variant-numeric:tabular-nums}.shell{max-width:1440px;margin:auto;padding:0 46px}.top{height:77px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:-.7px}.brand span{font:12px 'Microsoft YaHei',sans-serif;color:var(--muted);margin-left:15px;letter-spacing:0}.demo{font-size:12px;color:var(--muted);background:var(--tint);padding:4px 10px;border-radius:4px}header{padding:30px 0 23px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0 0 5px;font-size:29px;letter-spacing:-1px;font-weight:600}p{margin:0}nav{display:flex;gap:32px;border-bottom:1px solid var(--line)}nav button{border:0;border-radius:0;padding:13px 0;background:transparent;color:var(--muted)}nav button.active{border-bottom:2px solid var(--accent);color:var(--accent);font-weight:600}main{padding-top:28px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.intro h2{font-size:20px;margin:0 0 4px;font-weight:600}.notice{display:flex;align-items:center;gap:12px;padding:13px 17px;background:#f5ede2;border:1px solid #e9d9c6;border-radius:6px;margin-bottom:24px;color:#674b31}.notice p{flex:1}.notice b{font-weight:600}.notice small{display:block;color:#78634c}.notice button{border-color:#dbc4aa}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:17px}.filters{display:flex;gap:5px;flex-wrap:wrap}.filters button{background:transparent;border-color:transparent;color:var(--muted);padding:6px 12px}.filters button.active{background:#eae4d7;color:#3f382f}.count{font:12px Consolas,monospace;margin-left:7px;opacity:.8}input{width:210px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px 11px;color:var(--ink);caret-color:var(--accent)}input::placeholder{color:var(--muted)}.tablewrap{overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}table{border-collapse:collapse;width:100%;text-align:left;min-width:1060px}th{font-weight:500;color:var(--muted);font-size:12px;background:#f8f6f0;padding:13px 18px}td{padding:23px 18px;border-top:1px solid var(--line);vertical-align:middle}th:first-child{width:18%}th:nth-child(2){width:11%}th:nth-child(3){width:30%}th:nth-child(4){width:23%}th:last-child{width:18%}tbody tr:hover{background:#fdfcf9}.stockname{font-size:16px;font-weight:600}.sub{font-size:12px;color:var(--muted);margin-top:3px}.rating{font-size:12px;color:#756032;display:block;margin-top:7px}.price{font-size:18px}.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-size:12px;background:var(--tint);border-radius:4px;color:#685d4c}.pill.green{background:#eaf0e6;color:#366141}.pill.blue{background:#eaf0f4;color:#3b5e79}.pill.warm{background:#f5e9df;color:#8b4928}.dot{width:5px;height:5px;border-radius:50%;background:currentColor}.actions{display:flex;align-items:center;gap:13px;margin-bottom:4px}.actions button{white-space:nowrap}.statusnote{font-size:12px;color:var(--muted);margin-top:8px}.scale{position:relative;padding-top:15px;max-width:310px}.track{height:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.track i:first-child{background:#a1b99a}.track i:nth-child(2){background:#d8ccb0}.track i:last-child{background:#d4a698}.pin{position:absolute;left:var(--pos);top:0;transform:translateX(-50%);font:11px Consolas;color:#463d31}.pin:after{content:'';display:block;width:1px;height:10px;background:#463d31;margin:0 auto}.ticks{display:flex;justify-content:space-between;margin-top:7px;font:12px Consolas;color:#746b5d}.scale.paused{opacity:.55}.legend{display:flex;gap:17px;font-size:11px;color:var(--muted);margin-top:9px}.legend span:before{content:'';display:inline-block;width:7px;height:7px;background:#a1b99a;margin-right:5px}.legend span:nth-child(2):before{background:#c4c3a6}.legend span:nth-child(3):before{background:#d5bba4}.legend span:nth-child(4):before{background:#d4a698}.placeholder{color:#8a8377;font-size:13px}.placeholder small{display:block;font-size:12px;margin-top:5px}.foot{display:flex;justify-content:space-between;gap:20px;margin:16px 0 30px;color:var(--muted);font-size:12px}.empty{text-align:center;padding:65px;color:var(--muted)}.bottomnote{margin:20px 0 32px;font-size:12px;color:var(--muted)}dialog{border:0;padding:0;margin:0 0 0 auto;width:min(670px,100%);max-width:100%;height:100dvh;max-height:100dvh;background:var(--paper);color:var(--ink);box-shadow:-15px 0 60px #30281d24}dialog::backdrop{background:#29251f40}.drawer{display:flex;flex-direction:column;height:100%}.drawerhead{padding:26px 30px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start}.drawerhead h2{margin:4px 0;font-size:24px}.drawerbody{padding:27px 30px;overflow:auto;flex:1}.drawerbody h3{font-size:15px;margin:27px 0 12px}.drawerbody p{line-height:1.9;color:#62594d}.drawerfoot{padding:18px 30px;border-top:1px solid var(--line);background:#fff}.drawerfoot .buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:13px}.prices{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 8px;border:1px solid var(--line);border-radius:6px;background:#fff}.prices>div{padding:15px 12px;border-right:1px solid var(--line)}.prices>div:last-child{border:0}.prices small{display:block;color:var(--muted);font-size:12px}.prices strong{display:block;font:21px/1.7 Consolas}.old{font:12px Consolas;color:var(--muted);text-decoration:line-through}.reason{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:70px 1fr;gap:16px}.reason b{font-size:13px;font-weight:500}.reason span{font-size:13px;color:var(--muted)}.callout{padding:14px 17px;background:var(--tint);border-radius:5px;font-size:13px;margin-top:18px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#343d30;color:#fff;border-radius:7px;padding:12px 22px;box-shadow:0 5px 24px #29251f22;z-index:4;max-width:90vw}.spinner{display:inline-block;width:10px;height:10px;border:1.5px solid #c9d4db;border-top-color:#45627b;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:760px){.shell{padding:0 18px}.brand span{display:none}.top{height:62px}header{padding:23px 0}h1{font-size:25px}header>button{display:none}nav{gap:25px}.intro{align-items:start;gap:10px}.intro>.muted{display:none}.toolbar{align-items:stretch;flex-direction:column;gap:12px}input{width:100%}.notice{align-items:start;flex-wrap:wrap}.notice p{flex-basis:80%}.notice button{margin-left:auto}.foot{flex-direction:column;gap:5px}.drawerhead,.drawerbody,.drawerfoot{padding-left:20px;padding-right:20px}.prices>div{padding:12px 8px}.prices strong{font-size:18px}.demo{font-size:11px}.bottomnote{line-height:1.8}}
</style>
</head>
<body>
<div class="shell">
<div class="top"><div class="brand">Dividend<span>分红与价值研究</span></div><span class="demo">交互原型 · 全部为演示数据</span></div>
<header><div><h1>红利选股</h1><p class="muted">从经营质量出发，让关注有依据，让价格有尺度。</p></div><button id="reset">重置演示</button></header>
<nav aria-label="主导航"><button data-nav="all">全部股票</button><button class="active" data-nav="favorites">收藏跟踪</button><button data-nav="screening">选股关注</button></nav>
<main id="main"></main>
<p class="bottomnote">原型说明：评估会在几秒内模拟完成；应用、暂停等操作仅在本页生效，不调用 Hermes 或真实监控。所有评级、报告和价格均为虚构示例。</p>
</div>
<dialog id="report" aria-labelledby="report-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const seed=[
{name:'示例水电',code:'600001',industry:'公用事业',score:'4.3',price:27.80,state:'pending',date:'—'},
{name:'示例消费',code:'600002',industry:'食品饮料',score:'4.1',price:142.60,state:'ready',date:'11-11 10:32',levels:[110,128,168,195]},
{name:'示例银行',code:'600003',industry:'银行',score:'4.0',price:38.25,state:'monitor',date:'11-08 16:20',levels:[29,34,44,51]},
{name:'示例能源',code:'600004',industry:'煤炭',score:'3.8',price:35.40,state:'monitor',date:'11-06 09:45',levels:[26,31,40,47],fresh:[28,33,43,50]},
{name:'示例高速',code:'600005',industry:'交通运输',score:'3.9',price:8.42,state:'paused',date:'11-05 14:10',levels:[6.5,7.5,10,11.5]},
{name:'示例制造',code:'600006',industry:'机械设备',score:'3.7',price:19.60,state:'gap',date:'11-10 11:08'}];
let stocks=structuredClone(seed),filter='all',query='',nav='favorites',activeId=null,timers=[],toastTimer,lastFocus;
const $=s=>document.querySelector(s),fmt=n=>Number(n).toFixed(2), labels=['重仓','加仓','减仓','全卖'];
const filters=[['all','全部收藏'],['pending','待评估'],['ready','待应用'],['monitor','监控中'],['paused','已暂停']];
function matches(s,key){return key==='all'||(key==='pending'?['pending','running','gap','failed'].includes(s.state):key==='ready'?(s.state==='ready'||!!s.fresh):s.state===key)}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function scale(s){if(!s.levels||s.state==='ready')return `<div class="placeholder">${s.state==='ready'?'评估已完成，确认后显示监控价格线':'尚未应用挡位'}<small>${s.state==='gap'?'资料不足，暂未生成有效价格线':'先评估，再决定是否开启监控'}</small></div>`;let pos=Math.max(4,Math.min(96,(s.price-s.levels[0])/(s.levels[3]-s.levels[0])*100));return `<div class="scale ${s.state==='paused'?'paused':''}" style="--pos:${pos}%"><div class="pin">现价</div><div class="track"><i></i><i></i><i></i></div><div class="ticks">${s.levels.map(x=>`<span>${fmt(x)}</span>`).join('')}</div><div class="legend">${labels.map(x=>`<span>${x}</span>`).join('')}</div></div>`}
function status(s){if(s.state==='running')return '<span class="pill blue"><i class="spinner"></i>评估中</span><div class="statusnote">正在复用基本面材料，补充估值依据</div>';if(s.fresh)return '<span class="pill green"><i class="dot"></i>监控中</span> <span class="pill warm">新评估待应用</span><div class="statusnote">旧挡位持续生效</div>';const info={pending:['','待评估','收藏后尚未评估挡位'],ready:['warm','待应用','评估完成，等待你确认'],monitor:['green','监控中','当前位于加仓与减仓线之间'],paused:['','已暂停','保留挡位，暂不推送提醒'],gap:['','资料不足','缺少可持续分红依据，可查看缺口'],failed:['','评估失败','请求未完成，可重新评估']}[s.state];return `<span class="pill ${info[0]}">${s.state==='monitor'?'<i class="dot"></i>':''}${info[1]}</span><div class="statusnote">${info[2]}</div>`}
function actions(s){if(s.state==='running')return '<button disabled>评估中…</button>';if(s.fresh||s.state==='ready')return `<div class="actions"><button class="primary" data-action="report" data-id="${s.code}">${s.fresh?'对比并应用':'查看并应用'}</button></div><button class="link" data-action="report" data-id="${s.code}">阅读评估报告</button>`;if(s.state==='pending'||s.state==='failed')return `<button data-action="evaluate" data-id="${s.code}">${s.state==='failed'?'重试评估':'评估挡位'}</button>`;if(s.state==='gap')return `<div class="actions"><button data-action="report" data-id="${s.code}">查看缺口</button></div><button class="link" data-action="evaluate" data-id="${s.code}">重新评估</button>`;return `<div class="actions"><button data-action="report" data-id="${s.code}">查看报告</button><button class="link" data-action="toggle" data-id="${s.code}">${s.state==='paused'?'恢复监控':'暂停'}</button></div><button class="link" data-action="evaluate" data-id="${s.code}">重新评估</button>`}
function render(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===nav));if(nav!=='favorites'){renderSource();return}const attention=stocks.filter(x=>matches(x,'ready')).length;let visible=stocks.filter(s=>matches(s,filter)&&(!query||s.name.includes(query)||s.code.includes(query)));$('#main').innerHTML=`<div class="intro"><div><h2>收藏跟踪</h2><p class="muted">好公司先收藏，价格合适再行动。</p></div><span class="muted">${stocks.length} 只收藏 · ${stocks.filter(x=>x.state==='monitor').length} 只监控中</span></div>${attention?`<div class="notice"><p><b>${attention} 份挡位评估等待确认</b><small>包含首次评估与监控中的新评估。确认应用后才会启用或替换监控挡位。</small></p><button id="see-ready">查看待应用</button></div>`:''}<div class="toolbar"><div class="filters" aria-label="收藏状态筛选">${filters.map(([key,label])=>`<button data-filter="${key}" aria-pressed="${filter===key}" class="${filter===key?'active':''}">${label}<span class="count">${stocks.filter(s=>matches(s,key)).length}</span></button>`).join('')}</div><input id="search" aria-label="搜索股票名称或代码" placeholder="搜索名称 / 代码" value="${query.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"></div><div class="tablewrap"><table><thead><tr><th>股票 / 基本面</th><th>现价（元）</th><th>已应用挡位（元）</th><th>评估与监控状态</th><th>操作</th></tr></thead><tbody>${visible.map(s=>`<tr><td><div class="stockname">${s.name}</div><div class="sub"><span class="num">${s.code}</span> · ${s.industry}</div><span class="rating">基本面 ${s.score} / 5 <span class="muted">· 演示</span></span></td><td><div class="price num">${fmt(s.price)}</div><div class="sub">模拟行情</div></td><td>${scale(s)}</td><td>${status(s)}${!['pending','running'].includes(s.state)?`<div class="sub">最近评估 <span class="num">${s.date}</span></div>`:''}</td><td>${actions(s)}</td></tr>`).join('')}</tbody></table>${visible.length?'':'<div class="empty">没有符合条件的收藏股。试试其他状态或搜索词。</div>'}</div><div class="foot"><span>显示 ${visible.length} / ${stocks.length} 只收藏 · 待应用包含仍在使用旧挡位监控的股票</span><span>收藏不自动开启监控 · 评估完成后由你确认</span></div>`}
function renderSource(){const exists=stocks.some(s=>s.code==='600007');$('#main').innerHTML=`<div class="intro"><div><h2>${nav==='screening'?'选股关注':'全部股票'}</h2><p class="muted">收藏后的快捷入口示例</p></div><button data-nav="favorites">返回收藏跟踪</button></div><div class="tablewrap"><table><thead><tr><th>股票</th><th>基本面</th><th>筛选结果</th><th>操作</th></tr></thead><tbody><tr><td><div class="stockname">示例通信</div><div class="sub">600007 · 通信</div></td><td>4.2 / 5 · 演示</td><td>符合筛选条件</td><td><button data-action="favorite" ${exists?'disabled':''}>${exists?'已加入收藏':'加入收藏'}</button></td></tr></tbody></table></div>${exists?'<div class="notice" style="margin-top:20px"><p><b>已加入收藏</b><small>可以现在评估挡位，也可以稍后前往收藏跟踪。</small></p><button class="primary" data-action="quick-evaluate">评估挡位</button><button data-nav="favorites">前往收藏跟踪</button></div>':''}`}
function evaluate(id){const s=stocks.find(x=>x.code===id);if(!s||s.state==='running')return;const previous=s.state;s.state='running';render();toast('已提交挡位评估，演示将在 3 秒后完成');timers.push(setTimeout(()=>{const levels=s.levels?s.levels.map(x=>+(x*1.04).toFixed(2)):[+(s.price*.72).toFixed(2),+(s.price*.86).toFixed(2),+(s.price*1.18).toFixed(2),+(s.price*1.4).toFixed(2)];if(s.levels){s.fresh=levels;s.state=previous==='paused'?'paused':'monitor'}else{s.levels=levels;s.state='ready'}s.date='11-11 现在';render();toast(`${s.name}评估完成，等待你查看并应用`);},3000))}
function openReport(id){const s=stocks.find(x=>x.code===id);activeId=id;lastFocus=document.activeElement;const gap=s.state==='gap',changing=!!s.fresh,canApply=!gap&&(s.state==='ready'||changing),levels=s.fresh||s.levels;$('#report').innerHTML=`<div class="drawer"><div class="drawerhead"><div><span class="pill ${gap?'':'warm'}">${gap?'资料不足':changing?'新评估待应用':s.state==='ready'?'首次评估 · 待应用':'已应用的评估'}</span><h2 id="report-title">${s.name} · 挡位评估</h2><p class="sub">${s.code} · 评估时间 ${s.date} · 演示报告</p></div><button data-action="close" aria-label="关闭报告">关闭</button></div><div class="drawerbody">${gap?`<h3>暂未生成有效挡位</h3><p>现有材料不足以确认普通股可持续分红，无法为四个价格点给出完整依据。</p><div class="callout">待补材料：普通与特别分红拆分、最近年度资本开支及现金流覆盖。收藏继续保留，当前不会开启监控。</div>`:`<p>${changing?'新一轮评估已完成。下面展示新挡位与当前生效挡位的对比，应用前仍沿用旧配置。':'四个价格观察点对应不同的估值前提。先阅读依据，再决定是否用于价格提醒。'}</p><div class="prices">${levels.map((x,i)=>`<div><small>${labels[i]}线</small><strong>${fmt(x)}</strong>${changing?`<span class="old">${fmt(s.levels[i])}</span>`:''}</div>`).join('')}</div><p class="sub">单位：人民币元 ${changing?'· 划线数字为当前生效值':''}</p><h3>估值依据</h3><p>本原型仅演示报告结构，不代表对具体公司的研究结论。正式报告应呈现采用的估值模型、盈利或净资产基础、参数来源与适用期间。</p>${labels.map((label,i)=>`<div class="reason"><b>${label}线</b><span>${['解释悲观情景下的价值基础，以及安全边际的公司级依据。','解释基准经营假设下的介入价格及其反证。','解释估值上行到该位置时，预期回报为何开始收窄。','解释乐观情景与价格隐含预期，说明何时应重新审视。'][i]}</span></div>`).join('')}<h3>风险与复评条件</h3><p>正式报告需列明盈利、分红、资本结构和治理方面的关键风险。新财报、分红方案或重大经营变化出现时，应重新审查价格基础。</p><details style="margin-top:20px"><summary style="cursor:pointer;color:var(--accent)">研究材料与来源</summary><p class="sub" style="margin-top:10px">正式版本显示复用的基本面报告、财务期间与新增证据；本原型无真实研究来源。</p></details><div class="callout">本页价格为虚构演示值，四条线是界面占位，不构成真实估值结论。</div>`}</div><div class="drawerfoot"><p class="sub">${gap?'补齐关键材料后可重新评估。':canApply?(changing?'确认后替换四条价格线，监控将开启。':'确认后保存四条价格线，并开启价格提醒。'):'当前展示已应用的挡位报告。'}</p><div class="buttons"><button data-action="close">${canApply?'暂不应用':'返回列表'}</button>${gap?`<button class="primary" data-action="retry-report">重新评估</button>`:canApply?`<button class="primary" data-action="apply">${changing?'替换挡位并开启监控':'应用挡位并开启监控'}</button>`:''}</div></div></div>`;$('#report').showModal()}
function closeReport(){$('#report').close();lastFocus?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){nav=b.dataset.nav;render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.id==='see-ready'){filter='ready';render();return}if(b.id==='reset'){timers.forEach(clearTimeout);stocks=structuredClone(seed);filter='all';query='';nav='favorites';render();toast('已重置演示');return}const a=b.dataset.action,id=b.dataset.id;if(a==='evaluate')evaluate(id);if(a==='report')openReport(id);if(a==='close')closeReport();if(a==='toggle'){const s=stocks.find(s=>s.code===id);s.state=s.state==='paused'?'monitor':'paused';render();toast(s.state==='paused'?'已暂停提醒，挡位配置保留':'已恢复监控')}if(a==='apply'){const s=stocks.find(s=>s.code===activeId);if(s.fresh){s.levels=s.fresh;delete s.fresh}s.state='monitor';closeReport();render();toast('挡位已应用，监控已开启（演示）')}if(a==='retry-report'){const id=activeId;closeReport();evaluate(id)}if(a==='favorite'){stocks.push({name:'示例通信',code:'600007',industry:'通信',score:'4.2',price:23.5,state:'pending',date:'—'});render()}if(a==='quick-evaluate'){const s=stocks.find(x=>x.code==='600007');if(s.state==='pending')evaluate(s.code);else toast('这只股票已经提交过评估，可前往收藏跟踪查看')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const start=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(start,start)}});$('#report').addEventListener('click',e=>{if(e.target===$('#report'))closeReport()});render();
</script></body></html>
